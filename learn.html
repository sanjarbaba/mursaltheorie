stify-content:space-between;gap:8px;margin-top:9px}.progress{height:9px;border-radius:99px;background:#ece7f2;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--c))}.words{display:grid;grid-template-columns:1fr 1fr;gap:8px}.word{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:15px}.word b{color:var(--p)}.sign{padding:18px;text-align:center}.signicon{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:950;background:white;border:8px solid #d22525}.sign.blue .signicon{border-color:#2772c7;color:#2772c7}.notice{padding:12px 14px;border:1px solid #edd8a8;background:#fff7e5;border-radius:14px}.overlay,.auth{position:fixed;inset:0;z-index:100;background:rgba(24,16,31,.62);display:grid;place-items:center;padding:12px;backdrop-filter:blur(9px)}.auth{z-index:120;background:linear-gradient(145deg,#fbf8ff,#ece4f8)}.modal,.authbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.95);border-radius:26px;box-shadow:0 30px 90px rgba(35,22,54,.24)}.authbox{width:min(430px,100%);padding:22px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0eafe;border-radius:13px;padding:4px;margin:12px 0}.tabs button{border:0;background:transparent;padding:9px}.tabs .on{background:white;border-radius:10px;color:var(--p);font-weight:850}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin-bottom:4px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.mhead{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:11px;background:#fff;border-bottom:1px solid var(--line)}.mbody{padding:15px}.boxes{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{padding:12px;border:1px solid var(--line);bac یلر','محیط و وضعیت اضطراری'],TOP=['Basisregel','Herkennen','Veilig handelen','Veelgemaakte fout','Examentip','Praktijk','Controle','Gevaar','Uitzondering','Samenvatting'],IMS=['Voetganger nadert zebrapad, auto stopt.jpg','Blauwe auto nadert stopbord.jpg','Kruispunt met haaientanden en voorrangsbord.jpg','Rotonde verlaten met rechter richtingaanwijzer.jpg','Veilig invoegen vanaf de acceleratiestrook.jpg','Snelweg met matrixbord 80 en bord 100.jpg','Blauwe auto op autoweg met 100-bord.jpg','Blauwe auto op landelijke 80-weg.jpg','Blauwe auto bij 50-km-bord.jpg','Blauwe auto bereidt rijstrookwissel voor.jpg','Blauwe auto haalt grijze auto links in.jpg','Grote volgafstand in zware regen.jpg','Mistachterlicht bij 50 meter zicht.jpg','Dode hoek: twee fietsposities naast vrachtwagen.jpg','Bus vertrekt, auto geeft ruimte.jpg','Achteruit uitparkeren: voorrang aan al het verkeer.jpg','Parkeerafstand bij de hoek: 5 meter.jpg','Remweg: 50 versus 100 km_u.jpg','Geen smartphone tijdens het rijden.jpg','Veilig ruimte maken voor de ambulance.jpg','Langzaam rijden langs spelende kinderen.jpg','Bandprofiel meten: 1,6 mm.jpg','Bandenspanning controleren bij een koude band.jpg','Dozen bij remmen: los of vastgezet.jpg','Veilige afhandeling van een kleine aanrijding.jpg'],WORDS=[['voorrang','حق تقدم'],['haaientanden','خط‌های مثلثی'],['rijstrook','خط عبور'],['invoegen','داخل شدن'],['uitvoegen','خارج شدن'],['remweg','مسافت ترمز'],['volgafstand','فاصله'],['zebrapad','گذرگاه پیاده'],['rotonde','میدان'],['snelweg','بزرگراه'],['dode hoek','نقطه کور'],['richtingaanwijzer','چراغ راهنما'],['dimlicht','چراغ پایین'],['parkeerverbod','ممنوعیت پارک'],['stopverbod','ممنوعیت توقف'],['voetganger','پیاده'],['fietser','دوچرخه‌سوار'],['gordel','کمربند ایمنی'],['aquaplaning','سر خوردن روی آب'],['inhalen','سبقت'],['voorsorteren','قرار گرفتن در خط مناسب'],['matrixbord','تابلوی ماتریسی'],['afrit','خروجی'],['vluchtstrook','شانه اضطراری']],Q=[['Je nadert haaientanden. Wat moet je doen?',['Voorrang verlenen','Doorrijden','Claxonneren'],0],['Wat doe je vóór een rijstrookwissel?',['Spiegels en dode hoek controleren','Harder rijden','Alleen richting aangeven'],0],['Wat gebeurt met de remweg bij hogere snelheid?',['Wordt langer','Wordt korter','Blijft gelijk'],0],['Waarvoor dient een zebrapad?',['Parkeren','Oversteken voor voetgangers','Inhalen'],1],['Wat betekent een stopbord?',['Volledig stoppen','Alleen afremmen','Voorrang nemen'],0],['Wat doe je bij vermoeidheid?',['Stoppen en rusten','Raam open en doorrijden','Sneller rijden'],0],['Mag je een smartphone vasthouden tijdens het rijden?',['Nee','Ja','Alleen bij file'],0],['Wat doe je bij een ambulance met signalen?',['Ruimte geven','Links blijven','Midden stoppen'],0],['Wat doe je bij aquaplaning?',['Rustig gas los','Hard remmen','Scherp sturen'],0],['Wat controleer je bij banden?',['Profiel en spanning','Alleen kleur','Alleen merk'],0]];const S={lang:localStorage.getItem('mt-lang')||'nl',view:(location.hash||'#dashboard').slice(1),mod:1,lesson:null,answer:null,auth:false,mode:'login',user:JSON.parse(localStorage.getItem('mt-user')||'null'),ep:0,wp:0,exam:null};const t=(a,b)=>S.lang==='fa'?b:a;function lessons(){return Array.from({length:150},(_,i)=>({id:i+1,module:Math.floor(i/10)+1,title:MOD[Math.floor(i/10)]+' — '+TOP[i%10]}))}function image(id){return IMS[(id-1)%IMS.length]}function done(){return JSON.parse(localStorage.getItem('mt-done')||'[]')}function isDone(id){return done().includes(id)}function toggle(id){let a=done();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('mt-done',JSON.stringify(a));render()}function go(v){S.view=v;location.hash=v;render();scrollTo(0,0)}function setLang(l){S.lang=l;localStorage.setItem('mt-lang',l);render()}function nav(){let a=[['dashboard','Dashboard','داشبورد'],['lessons','Lessen','درس‌ها'],['signs','Borden','علایم'],['words','Woorden','واژه‌ها'],['hazard','Training','تمرین'],['exams','Examens','امتحان‌ها']];return`<header class="top"><div class="logo" onclick="location.href='/'"><i>M</i>Mursaltheorie</div><div class="nav">${a.map(x=>`<button class="${S.view===x[0]?'on':''}" onclick="go('${x[0]}')">${t(x[1],x[2])}</button>`).join('')}</div><button class="lang ${S.lang==='fa'?'on':''}" onclick="setLang(S.lang==='nl'?'fa':'nl')">${S.lang==='nl'?'دری':'NL'}</button>${S.user?`<button class="user" onclick="go('profile')">👤 ${S.user.name}</button>`:`<button class="user" onclick="openAuth('login')">${t('Inloggen','ورود')}</button>`}</header>`}function mobile(){let a=[['dashboard','⌂'],['lessons','📘'],['signs','🚦'],['hazard','⚠'],['exams','✓']];return`<nav class="mobile">${a.map(x=>`<button class="${S.view===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}<br>${x[0]}</button>`).join('')}</nav>`}function quick(){let a=[['lessons','📘',t('150 lessen','۱۵۰ درس')],['signs','🚦',t('Borden','علایم')],['words','🔤','NL ↔ دری'],['hazard','⚠️',t('Situaties','موقعیت‌ها')],['exams','✅',t('30 examens','۳۰ امتحان')],['profile','👤',t('Profiel','پروفایل')]];return`<div class="quick">${a.map(x=>`<button class="qbtn" onclick="${x[0]==='profile'&&!S.user?"openAuth('login')":`go('${x[0]}')`}"><b>${x[1]} ${x[2]}</b><span>${t('Tik om te openen','برای باز کردن بزنید')}</span></button>`).join('')}</div>`}function dashboard(){let d=done().length;return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><section class="hero"><div class="glass pad"><span class="pill">Auto Theorie B</span><h1>${t('Welkom bij je','خوش آمدید به')} <span class="grad">${t('leeromgeving','محیط یادگیری')}</span></h1><p class="mut">${t('Alles staat rustig en duidelijk op één plek. Kies hieronder wat je wilt oefenen.','همه چیز ساده و روشن در یک جاست. انتخاب کنید چه چیزی را تمرین می‌کنید.')}</p><div class="acts"><button class="primary" onclick="go('lessons')">▶ ${t('Verder leren','ادامه یادگیری')}</button><button class="ghost" onclick="go('exams')">✓ ${t('Oefenexamen','امتحان تمرینی')}</button></div></div><div class="glass stats"><div class="stat"><b>${d}/150</b><span>${t('lessen klaar','درس کامل')}</span></div><div class="stat"><b>${Math.round(d/1.5)}%</b><span>${t('voortgang','پیشرفت')}</span></div><div class="stat"><b>30</b><span>${t('examens','امتحان')}</span></div><div class="stat"><b>NL + دری</b><span>${t('talen','زبان')}</span></div></div></section><div class="head"><div><h2>${t('Wat wil je doen?','چه می‌خواهید انجام دهید؟')}</h2><div class="mut">${t('Grote duidelijke knoppen.','دکمه‌های بزرگ و واضح.')}</div></div></div>${quick()}<div class="head"><h2>${t('Jouw voortgang','پیشرفت شما')}</h2></div><div class="glass pad"><div class="progress"><i style="width:${d/1.5}%"></i></div><p class="mut">${d} ${t('van de 150 lessen afgerond.','از ۱۵۰ درس کامل شده.')}</p></div></main>`}function lessonView(){let list=lessons().filter(x=>x.module===S.mod);return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><div><h2>${t('150 theorielessen','۱۵۰ درس تیوری')}</h2><div class="mut">${t('10 lessen per module. Geen lange lijst.','۱۰ درس در هر بخش. بدون فهرست طولانی.')}</div></div></div><div class="chips">${MOD.map((m,i)=>`<button class="chip ${S.mod===i+1?'on':''}" onclick="S.mod=${i+1};render()">${i+1}. ${S.lang==='fa'?FA[i]:m}</button>`).join('')}</div><div class="grid">${list.map(l=>`<article class="card lesson"><div class="pic"><img loading="lazy" src="images/${encodeURIComponent(image(l.id))}"></div><h3>${l.id}. ${S.lang==='fa'?FA[l.module-1]:l.title}</h3><p class="mut">${t('Korte uitleg, kernregel en oefenvraag.','توضیح کوتاه، قانون اصلی و سوال تمرینی.')}</p><div class="row"><span class="pill">${isDone(l.id)?'✓ '+t('Geleerd','یاد گرفتم'):t('Les','درس')}</span><button class="mini" onclick="openLesson(${l.id})">${t('Open les','باز کردن')}</button></div></article>`).join('')}</div><div class="pager"><button class="ghost" onclick="S.mod=Math.max(1,S.mod-1);render()">←</button><b>${S.mod}/15</b><button class="ghost" onclick="S.mod=Math.min(15,S.mod+1);render()">→</button></div></main>`}function openLesson(id){S.lesson=lessons().find(x=>x.id===id);S.answer=null;render()}function lessonModal(){if(!S.lesson)return'';let l=S.lesson;return`<div class="overlay" onclick="if(event.target===this){S.lesson=null;render()}"><section class="modal ${S.lang==='fa'?'rtl':''}"><div class="mhead"><button class="ghost" onclick="S.lesson=null;render()">✕</button><b>${l.id}. ${t(l.title,FA[l.module-1])}</b></div><div class="mbody"><div class="pic" style="height:250px"><img src="images/${encodeURIComponent(image(l.id))}"></div><div class="boxes" style="margin-top:10px"><div class="box"><b>${t('Kernregel','قانون اصلی')}</b><p class="mut">${t('Kijk eerst naar de volledige situatie, verkeersborden, markering en andere weggebruikers. Handel daarna veilig en volgens de regel.','اول تمام وضعیت، علایم، خط‌کشی و دیگر کاربران جاده را بررسی کنید و سپس امن عمل کنید.')}</p></div><div class="box"><b>${t('Examentip','نکته امتحان')}</b><p class="mut">${t('Lees de vraag rustig. Zoek eerst het belangrijkste verkeersdetail voordat je antwoordt.','سوال را آرام بخوانید و قبل از پاسخ مهم‌ترین جزئیات ترافیک را پیدا کنید.')}</p></div></div><div class="box" style="margin-top:9px"><b>${t('Oefenvraag','سوال تمرینی')}</b><p>${t('Wat is de beste eerste stap?','بهترین قدم اول چیست؟')}</p>${[t('Meteen handelen','فوراً عمل کنید'),t('De hele situatie beoordelen','تمام وضعیت را بررسی کنید'),t('Altijd stoppen','همیشه توقف کنید')].map((a,i)=>`<button class="ans ${S.answer===i?'sel':''}" onclick="S.answer=${i};render()">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}${S.answer!==null?`<div class="notice" style="margin-top:9px">${S.answer===1?t('Goed. Eerst beoordelen, daarna handelen.','درست است. اول بررسی، بعد عمل.'):t('Kijk opnieuw naar de kernregel.','دوباره قانون اصلی را بخوانید.')}</div>`:''}</div><div class="acts"><button class="primary" onclick="toggle(${l.id})">${isDone(l.id)?'✓ '+t('Geleerd','یاد گرفتم'):t('Markeer geleerd','علامت یادگرفته')}</button></div></div></section></div>`}function signs(){let a=[['50','Maximumsnelheid 50'],['80','Maximumsnelheid 80'],['▽','Voorrang verlenen'],['STOP','Stop'],['○','Gesloten voor voertuigen'],['P','Parkeren'],['×','Stopverbod'],['🚗','Autoweg'],['🛣','Autosnelweg'],['△','Waarschuwing'],['🚸','Voetgangers'],['↻','Rotonde']];return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h2>${t('Verkeersborden','علایم ترافیکی')}</h2></div><div class="grid">${a.map((x,i)=>`<div class="card sign ${i>4?'blue':''}"><div class="signicon">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div></main>`}function words(){let st=S.wp*12,sub=WORDS.slice(st,st+12),mx=Math.ceil(WORDS.length/12);return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h2>${t('Verkeerswoorden','واژه‌های ترافیکی')}</h2></div><div class="words">${sub.map(w=>`<div class="word"><span>${w[0]}</span><b>${w[1]}</b></div>`).join('')}</div><div class="pager"><button class="ghost" onclick="S.wp=Math.max(0,S.wp-1);render()">←</button><b>${S.wp+1}/${mx}</b><button class="ghost" onclick="S.wp=Math.min(${mx-1},S.wp+1);render()">→</button></div></main>`}const H=[['Een kind staat vlak bij de rijbaan.','rem'],['Je ziet ver vooruit een rood verkeerslicht.','gas'],['De weg is vrij en er is geen direct gevaar.','nothing'],['Een auto remt plots voor je.','rem'],['Je nadert rustig een rotonde met verkeer.','gas'],['Een fietser wijkt onverwacht uit.','rem']];function hazard(){let i=+(localStorage.getItem('hi')||0)%H.length,h=H[i];return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h2>${t('Situatietraining','تمرین موقعیت')}</h2></div><div class="glass pad"><div class="pic" style="height:300px"><img src="images/${encodeURIComponent(image(i+1))}"></div><h2>${h[0]}</h2><p class="mut">${t('Wat doe je?','چه کار می‌کنید؟')}</p><div class="acts">${[['rem','Remmen','ترمز'],['gas','Gas los','رها کردن گاز'],['nothing','Niets doen','هیچ']].map(x=>`<button class="primary" onclick="haz('${x[0]}','${h[1]}')">${t(x[1],x[2])}</button>`).join('')}</div><div id="hm"></div></div></main>`}function haz(a,c){document.getElementById('hm').innerHTML=`<div class="notice" style="margin-top:12px">${a===c?t('Goed!','درست!'):t('Niet juist.','درست نیست.')}</div>`;if(a===c){localStorage.setItem('hi',(+(localStorage.getItem('hi')||0)+1)%H.length);setTimeout(render,650)}}function exams(){let st=S.ep*6;return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><div><h2>${t('30 oefenexamens','۳۰ امتحان تمرینی')}</h2><div class="mut">50 ${t('vragen per examen','سوال در هر امتحان')}</div></div></div><div class="exgrid">${Array.from({length:6},(_,j)=>`<div class="card pad"><span class="pill">${t('Examen','امتحان')} ${st+j+1}</span><h3>50 ${t('vragen','سوال')}</h3><p class="mut">30 ${t('minuten','دقیقه')}</p><button class="primary" onclick="startExam(${st+j+1})">${t('Start examen','شروع امتحان')}</button></div>`).join('')}</div><div class="pager"><button class="ghost" onclick="S.ep=Math.max(0,S.ep-1);render()">←</button><b>${S.ep+1}/5</b><button class="ghost" onclick="S.ep=Math.min(4,S.ep+1);render()">→</button></div></main>`}function startExam(n){S.exam={n,i:0,a:Array(50).fill(null),r:1800};render();S.exam.timer=setInterval(()=>{if(!S.exam)return;S.exam.r--;let el=document.getElementById('timer');if(el)el.textContent=fmt(S.exam.r);if(S.exam.r<=0)finish()},1000)}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function eq(i,n){let q=Q[(i+n)%Q.length];return{q:q[0],a:q[1],c:q[2],im:image(i+n)}}function examView(){let e=S.exam,q=eq(e.i,e.n);return`<div class="exam"><div class="examtop"><button class="ghost" onclick="closeExam()">✕</button><b>${e.i+1}/50</b><div class="progress" style="flex:1"><i style="width:${(e.i+1)*2}%"></i></div><b id="timer">${fmt(e.r)}</b></div><main class="examc"><section class="glass question"><div class="pic" style="height:min(34vh,240px)"><img src="images/${encodeURIComponent(q.im)}"></div><h2>${q.q}</h2>${q.a.map((a,i)=>`<button class="ans ${e.a[e.i]===i?'sel':''}" onclick="S.exam.a[S.exam.i]=${i};render()">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div class="pager"><button class="ghost" onclick="S.exam.i=Math.max(0,S.exam.i-1);render()">←</button>${e.i===49?`<button class="primary" onclick="finish()">${t('Inleveren','تحویل')}</button>`:`<button class="primary" onclick="S.exam.i++;render()">${t('Volgende','بعدی')} →</button>`}</div></section></main></div>`}function finish(){if(S.exam?.timer)clearInterval(S.exam.timer);let sc=0;for(let i=0;i<50;i++)if(S.exam.a[i]===eq(i,S.exam.n).c)sc++;alert(t(`Score: ${sc}/50`,`امتیاز: ${sc}/50`));S.exam=null;render()}function closeExam(){if(S.exam?.timer)clearInterval(S.exam.timer);S.exam=null;render()}function profile(){if(!S.user){openAuth('login');return''}let d=done().length;return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="glass pad"><span class="pill">${t('Profiel','پروفایل')}</span><h2>👤 ${S.user.name}</h2><p class="mut">${S.user.email}</p><div class="stats" style="padding:0"><div class="stat"><b>${d}</b><span>${t('lessen klaar','درس کامل')}</span></div><div class="stat"><b>${Math.round(d/1.5)}%</b><span>${t('voortgang','پیشرفت')}</span></div></div><div class="acts"><button class="primary" onclick="go('dashboard')">Dashboard</button><button class="ghost" onclick="logout()">${t('Uitloggen','خروج')}</button></div></div></main>`}function openAuth(m){S.mode=m;S.auth=true;render()}function auth(){if(!S.auth)return'';let r=S.mode==='register';return`<div class="auth ${S.lang==='fa'?'rtl':''}"><div class="authbox"><div class="logo"><i>M</i>Mursaltheorie</div><p class="mut">${t('Log in of maak een account om je voortgang te bewaren.','برای نگهداری پیشرفت وارد شوید یا حساب بسازید.')}</p><div class="tabs"><button class="${!r?'on':''}" onclick="S.mode='login';render()">${t('Inloggen','ورود')}</button><button class="${r?'on':''}" onclick="S.mode='register';render()">${t('Account maken','ساخت حساب')}</button></div>${r?`<div class="field"><label>${t('Naam','نام')}</label><input id="name"></div>`:''}<div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>${t('Wachtwoord','رمز')}</label><input id="pass" type="password"></div><button class="primary" style="width:100%" onclick="submitAuth()">${r?t('Account maken','ساخت حساب'):t('Inloggen','ورود')}</button><button class="ghost" style="width:100%;margin-top:7px" onclick="S.auth=false;render()">${t('Terug','بازگشت')}</button><p class="mut" style="font-size:11px">${t('Testlogin: gegevens worden voorlopig alleen op dit apparaat bewaard.','ورود آزمایشی: اطلاعات فعلاً فقط در همین دستگاه ذخیره می‌شود.')}</p></div></div>`}function submitAuth(){let e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value,n=document.getElementById('name')?.value.trim()||e.split('@')[0];if(!e.includes('@')||p.length<4){alert(t('Controleer e-mail en wachtwoord.','ایمیل و رمز را بررسی کنید.'));return}S.user={email:e,name:n};localStorage.setItem('mt-user',JSON.stringify(S.user));S.auth=false;go('dashboard')}function logout(){localStorage.removeItem('mt-user');S.user=null;go('dashboard')}function render(){if(!['dashboard','lessons','signs','words','hazard','exams','profile'].includes(S.view))S.view='dashboard';document.documentElement.dir=S.lang==='fa'?'rtl':'ltr';document.getElementById('app').innerHTML=S.exam?examView():nav()+({dashboard,lessons:lessonView,signs,words,hazard,exams,profile}[S.view]||dashboard)()+mobile()+lessonModal()+auth()}window.addEventListener('hashchange',()=>{S.view=(location.hash||'#dashboard').slice(1);render()});if(new URLSearchParams(location.search).get('auth'))openAuth(new URLSearchParams(location.search).get('auth'));else render();</script></body></html>
