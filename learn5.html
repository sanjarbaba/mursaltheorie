function examsView(){let st=S.examPage*6,list=S.apiExams||Array.from({length:30},(_,i)=>({number:i+1,questionCount:50,durationSeconds:1800,titleNl:`Oefenexamen ${i+1}`,titleFa:`امتحان تمرینی ${i+1}`})),shown=list.slice(st,st+6),pages=Math.max(1,Math.ceil(list.length/6));return`<main class="wrap ${S.lang==='fa'?'rtl':''}">
<div class=head><h2>${tr('30 oefenexamens','۳۰ امتحان تمرینی')}</h2></div><div class=grid>${shown.map(exam=>`<div class="card pad"><span class=pill>${S.lang==='fa'?exam.titleFa:exam.titleNl}</span><h3>${exam.questionCount} ${tr('vragen','سوال')}</h3><p class=mut>${Math.round(exam.durationSeconds/60)} ${tr('minuten','دقیقه')}</p><button class=primary onclick="startExam(${exam.number})">${tr('Start','شروع')}</button></div>`).join('')}</div><div class=pager><button class=ghost onclick="S.examPage=Math.max(0,S.examPage-1);render()">←</button><b>${S.examPage+1}/${pages}</b><button class=ghost onclick="S.examPage=Math.min(${pages-1},S.examPage+1);render()">→</button></div></main>`}

function questionFor(i,n,remote){let q=remote[i];return{q:tr(q.promptNl,q.promptFa),a:S.lang==='fa'?q.optionsFa:q.optionsNl,qNl:q.promptNl,qFa:q.promptFa,aNl:q.optionsNl,aFa:q.optionsFa,c:q.correctOption,scene:q.category,image:q.media?.[0]?.src,id:q.id}}
async function startExam(n){S.examResult=null;if(!S.user||!window.mtStartExam){openAuth('login');return}let attempt;try{attempt=await window.mtStartExam(n)}catch(error){console.error('V1-examen kon niet worden gestart.',error);alert(tr('Het examen kon niet worden gestart. Probeer het opnieuw.','امتحان شروع نشد. دوباره تلاش کنید.'));return}let total=attempt.questions.length;S.exam={n,id:attempt.id,i:0,a:Array(total).fill(null),r:attempt.exam.durationSeconds||1800,questions:attempt.questions,remote:true,pending:[]};render();S.exam.timer=setInterval(()=>{if(!S.exam)return;S.exam.r--;let e=document.getElementById('timer');if(e)e.textContent=time(S.exam.r);if(S.exam.r<=0)finishExam()},1000)}
function time(s){return String(Math.max(0,Math.floor(s/60))).padStart(2,'0')+':'+String(Math.max(0,s%60)).padStart(2,'0')}
function chooseExamAnswer(i){let e=S.exam;if(!e)return;e.a[e.i]=i;let q=questionFor(e.i,e.n,e.questions);render();let pending=window.mtSaveExamAnswer(e.id,q.id,i).then(()=>({ok:true}),error=>({ok:false,error}));e.pending.push(pending)}
function examView(){let e=S.exam,total=e.a.length,q=questionFor(e.i,e.n,e.questions);return`<div class="exam ${S.lang==='fa'?'rtl':''}"><div class=examtop><button class=ghost onclick=closeExam()>✕</button><b>${e.i+1}/${total}</b><div class=bar><i style="width:${(e.i+1)/total*100}%"></i></div><b id=timer>${time(e.r)}</b></div><main class=examc><section class="card pad"><div class="pic questionpic" style="height:260px"><img src="${q.image||sceneImage(q.scene)}" alt="${esc(q.qNl)}"></div>${S.lang==='fa'?bilingual(q.qNl,q.qFa):`<h2>${q.qNl}</h2>`}${q.aNl.map((a,i)=>`<button class="ans ${e.a[e.i]===i?'selected':''}" onclick="chooseExamAnswer(${i})">${String.fromCharCode(65+i)}. ${bilingualAnswer(a,q.aFa[i])}</button>`).join('')}<div class=pager><button class=ghost onclick="S.exam.i=Math.max(0,S.exam.i-1);render()" ${e.i===0?'disabled':''}>←</button>${e.i===total-1?`<button class=primary onclick=finishExam()>${tr('Inleveren','Inleveren · تحویل')}</button>`:`<button class=primary onclick="S.exam.i++;render()">${tr('Volgende','Volgende · بعدی')} →</button>`}</div></section></main></div>`}
async function finishExam(){if(S.exam?.timer)clearInterval(S.exam.timer);let e=S.exam,score=0,wrong=[],passed,total=e.a.length,questions=e.questions;let synced=await Promise.all(e.pending);if(synced.some(item=>!item.ok)){alert(tr('Niet alle antwoorden zijn opgeslagen. Controleer je verbinding en probeer opnieuw.','همه جواب‌ها ذخیره نشد. اتصال را بررسی و دوباره تلاش کنید.'));S.exam.timer=setInterval(()=>{if(S.exam)S.exam.r--},1000);return}try{let response=await window.mtSubmitExam(e.id,S.lang),result=response.result,byId=new Map(result.answers.map(a=>[a.questionId,a]));questions=questions.map(q=>({...q,correctOption:byId.get(q.id)?.correctOption}));wrong=questions.map((q,i)=>byId.get(q.id)?.isCorrect?null:i).filter(i=>i!==null);score=total-wrong.length;passed=result.passed}catch(error){console.error('Examen kon niet worden ingeleverd.',error);alert(tr('Inleveren is niet gelukt. Controleer je verbinding en probeer opnieuw.','تحویل امتحان انجام نشد. اتصال را بررسی و دوباره تلاش کنید.'));S.exam.timer=setInterval(()=>{if(S.exam)S.exam.r--},1000);return}S.examResult={n:e.n,score,total,passed,questions,answers:[...e.a],wrong,pos:0,review:false};localStorage.setItem('mt-last-exam',JSON.stringify({n:e.n,score,date:new Date().toISOString()}));S.exam=null;render()}
function resultView(){let r=S.examResult;if(r.review){let i=r.wrong[r.pos],q=questionFor(i,r.n,r.questions),chosen=r.answers[i];return`<div class="exam ${S.lang==='fa'?'rtl':''}"><div class=examtop><button class=ghost onclick="S.examResult.review=false;render()">←</button><b>${tr('Fout','Fout · اشتباه')} ${r.pos+1}/${r.wrong.length}</b><div class=bar><i style="width:${(r.pos+1)/r.wrong.length*100}%"></i></div></div><main class=examc><section class="card pad"><div class="pic questionpic" style="height:260px"><img src="${q.image||sceneImage(q.scene)}" alt="${esc(q.qNl)}"></div><span class=pill>${tr('Vraag','Vraag · سوال')} ${i+1}</span>${S.lang==='fa'?bilingual(q.qNl,q.qFa):`<h2>${q.qNl}</h2>`}${q.aNl.map((a,j)=>`<div class="ans ${j===q.c?'good':j===chosen?'bad':''}">${String.fromCharCode(65+j)}. ${bilingualAnswer(a,q.aFa[j])}${j===q.c?' ✓':j===chosen?' ✕':''}</div>`).join('')}<div class="feedback no">${chosen==null?tr('Geen antwoord gegeven.','Geen antwoord gegeven · جوابی داده نشده است.'):tr('Jouw antwoord was niet juist.','Jouw antwoord was niet juist · جواب شما درست نبود.')}<small>${S.lang==='fa'?bilingual('Het groene antwoord is correct. Bekijk ook het verkeersbeeld opnieuw.','جواب سبز درست است. تصویر ترافیکی را نیز دوباره ببینید.'):'Het groene antwoord is correct. Bekijk ook het verkeersbeeld opnieuw.'}</small></div><div class=pager><button class=ghost onclick="S.examResult.pos=Math.max(0,S.examResult.pos-1);render()" ${r.pos===0?'disabled':''}>←</button><button class=primary onclick="S.examResult.pos=Math.min(S.examResult.wrong.length-1,S.examResult.pos+1);render()" ${r.pos===r.wrong.length-1?'disabled':''}>${tr('Volgende fout','Volgende fout · اشتباه بعدی')} →</button></div></section></main></div>`}let passed=r.passed;return`<div class="exam ${S.lang==='fa'?'rtl':''}"><main class=examc><section class="card pad result-card"><div class="score-ring ${passed?'passed':'failed'}"><b>${r.score}</b><span>/${r.total}</span></div><h1>${passed?tr('Examen behaald','Examen behaald · امتحان موفق'):tr('Nog even oefenen','Nog even oefenen · کمی بیشتر تمرین کنید')}</h1><p class=mut>${tr(`${r.wrong.length} vragen fout of niet ingevuld.`,`${r.wrong.length} vragen fout of niet ingevuld · تعداد ${r.wrong.length} سوال اشتباه یا بی‌جواب.`)}</p><div class=acts>${r.wrong.length?`<button class=primary onclick="S.examResult.review=true;S.examResult.pos=0;render()">${tr('Bekijk mijn fouten','Bekijk mijn fouten · اشتباهاتم را ببین')} (${r.wrong.length})</button>`:''}<button class=ghost onclick="S.examResult=null;render()">${tr('Terug naar examens','Terug naar examens · بازگشت به امتحان‌ها')}</button></div></section></main></div>`}
function closeExam(){if(S.exam?.timer)clearInterval(S.exam.timer);S.exam=null;render()}
function go(v){if(!VALID_VIEWS.includes(v))return;S.view=v;localStorage.setItem('mt-view',v);S.lesson=null;S.hazAns=null;render();scrollTo(0,0)}
function setLanguage(l){S.lang=l;localStorage.setItem('mt-lang',l);render()}
function setLang(l){setLanguage(l)}
function openAuth(mode='login'){if(S.user){S.auth=true;render();return}window.mtOpenAuth?.(mode)}
function closeAuth(){S.auth=false;render()}
function switchAuth(mode){openAuth(mode)}
function submitAuth(event){event.preventDefault();openAuth(S.authMode)}
function logout(){window.mtSignOut?.()}
function authView(){if(!S.auth||!S.user)return'';return`<div class=overlay onclick="if(event.target===this)closeAuth()"><section class="modal ${S.lang==='fa'?'rtl':''}" style="max-width:580px"><div class=mhead><button class=ghost onclick=closeAuth()>✕</button><b>${tr('Jouw account','حساب شما')}</b></div><div class=mbody><div class=box><h4>${esc(S.user.name||tr('Jouw account','حساب شما'))}</h4><p class=mut>${esc(S.user.email||'')}</p></div><div class=head><div><h2>${tr('Privacy en gegevens','حریم خصوصی و داده‌ها')}</h2><p class=mut>${tr('Download een kopie of verwijder jouw account definitief.','یک نسخه دانلود کنید یا حساب خود را برای همیشه حذف کنید.')}</p></div></div><div class=acts><button class=ghost onclick=exportMyData()>${tr('Download mijn gegevens','دانلود داده‌های من')}</button><button class=ghost style="color:var(--bad);border-color:#e3aaa4" onclick=deleteMyAccount()>${tr('Account verwijderen','حذف حساب')}</button></div><p class=mut style="font-size:12px">${tr('Verwijderen wist je profiel, voortgang en examenresultaten. Dit kan niet ongedaan worden gemaakt.','حذف، نمایه، پیشرفت و نتایج امتحان شما را پاک می‌کند و قابل بازگشت نیست.')}</p></div></section></div>`}
async function exportMyData(){try{await window.mtExportAccountData?.()}catch(error){alert(tr('Downloaden is niet gelukt. Probeer het opnieuw.','دانلود انجام نشد. دوباره تلاش کنید.'))}}
async function deleteMyAccount(){let phrase='VERWIJDER MIJN ACCOUNT',confirmation=prompt(tr(`Typ exact “${phrase}” om door te gaan.`,`برای ادامه دقیقاً “${phrase}” را تایپ کنید.`));if(confirmation!==phrase){if(confirmation!==null)alert(tr('De bevestiging klopt niet. Er is niets verwijderd.','تأیید درست نیست. چیزی حذف نشد.'));return}if(!confirm(tr('Weet je zeker dat je jouw account en alle voortgang definitief wilt verwijderen?','آیا مطمئن هستید که حساب و تمام پیشرفت خود را برای همیشه حذف کنید؟')))return;try{await window.mtDeleteAccount?.(confirmation);location.reload()}catch(error){alert(tr('Verwijderen is niet gelukt. Je account is mogelijk nog actief; neem contact op als dit blijft gebeuren.','حذف انجام نشد. ممکن است حساب هنوز فعال باشد؛ اگر ادامه داشت تماس بگیرید.'))}}
function setMod(m){if(m<1||m>15)return;S.mod=m;render();scrollTo(0,0)}
function render(){document.documentElement.lang=S.lang==='fa'?'fa':'nl';document.documentElement.dir=S.lang==='fa'?'rtl':'ltr';root.innerHTML=S.exam?examView():S.examResult?resultView():nav()+({dashboard,lessons:lessonsView,signs:signsView,words:wordsView,hazard:hazardView,exams:examsView}[S.view]||dashboard)()+mobile()+lessonModal()+authView()}
// Inline handlers are used by the static web shell. Explicitly expose them so
// deployments that execute this script in a scoped wrapper keep navigation and
// answer buttons functional.
Object.assign(window,{go,setLanguage,openAuth,closeAuth,logout,openLesson,toggleDone,chooseHaz,nextHaz,startExam,chooseExamAnswer,finishExam,closeExam,setMod,exportMyData,deleteMyAccount});
render();
</script><script defer src="/clerk-auth-v5.js"></script><script defer src="/account-data.js?v=2"></script></body></html>
