<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mursaltheorie beheer</title><script src="/clerk-auth.js"></script><style>:root{font-family:system-ui;color:#eef2ff;background:#07112f}body{margin:0;background:radial-gradient(circle at 80% 0,#35158a,#07112f 55%);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:28px 18px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;background:#7c3aed;color:white}.alt{background:#182b5d}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card,.panel{background:#101f49d9;border:1px solid #38528f;border-radius:18px;padding:18px}.card strong{display:block;font-size:2rem;color:#c4b5fd}.panel{overflow:auto}.notice{padding:16px;border-radius:14px;background:#132a5d;margin:15px 0}.error{background:#5b1b3a}.muted{color:#b8c5ee;font-size:.9rem}.user{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:12px;align-items:center;border-top:1px solid #2d4479;padding:15px 0;min-width:760px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#273e7a;font-size:.78rem}.tag.active{background:#166534;color:#dcfce7}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:.82rem;padding:8px 10px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}header{display:block}}</style></head><body><main class="wrap"><header><h1>Beheerderspaneel</h1><p class="muted">Betalingen, gebruikers en cursus toegang</p><button class="btn alt" id="login">Inloggen</button></header><div id="notice" class="notice">Beveiligde beheeromgeving laden…</div><section id="app" hidden><div class="cards"><div class="card">Gebruikers<strong id="countUsers">–</strong></div><div class="card">Beheerders<strong id="countAdmins">–</strong></div><div class="card">Betaalde orders<strong id="countPaid">–</strong></div></div><div class="panel"><h2>Gebruikers</h2><p class="muted">Controleer eerst de Mollie-betaling.</p><div id="users"></div></div></section></main><script>const notice=document.querySelector('#notice'),app=document.querySelector('#app'),login=document.querySelector('#login'),users=document.querySelector('#users'),countUsers=document.querySelector('#countUsers'),countAdmins=document.querySelector('#countAdmins'),countPaid=document.querySelector('#countPaid');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=v=>v?new Date(v).toLocaleDateString('nl-NL'):'–';async function call(url,opt={}){const c=await mtClerkReady,t=await c.session?.getToken(),r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`}}),j=await r.json();if(!r.ok)throw Error(j?.error?.message||'Actie mislukt');return j.data}function render(d){countUsers.textContent=d.counts.users;countAdmins.textContent=d.counts.admins;countPaid.textContent=d.counts.paid_orders;users.innerHTML=d.users.map(u=>{const active=u.entitlement_status==='active'&&u.entitlement_ends_at&&new Date(u.entitlement_ends_at)>new Date();return `<div class="user"><div><strong>${esc(u.display_name||'Onbekend')}</strong><div class="muted">${esc(u.email||'Geen e-mail')}<br><span class="tag ${active?'active':''}">${active?'actief':esc(u.access_status)}</span></div></div><div>${esc(u.latest_description||'Geen bestelling')}<div class="muted">${u.latest_amount?'€ '+esc(u.latest_amount):''} · ${esc(u.latest_purchase_status||'–')}</div></div><div>${u.entitlement_product_key?esc(u.entitlement_product_key):'Geen toegang'}<div class="muted">${active?'actief tot '+fmt(u.entitlement_ends_at):'tot –'}</div></div><div class="actions"><button class="btn small grant" data-id="${esc(u.clerk_user_id)}">Geef toegang</button><button class="btn alt small revoke" data-id="${esc(u.clerk_user_id)}">Blokkeer</button></div></div>`}).join('');document.querySelectorAll('.grant').forEach(b=>b.onclick=async()=>{if(!confirm('Geef 30 dagen toegang?'))return;await call('/api/v1/admin?resource=grant',{method:'POST',body:JSON.stringify({clerkUserId:b.dataset.id,productKey:'theory_b_nl_fa_30d',days:30})});load()});document.querySelectorAll('.revoke').forEach(b=>b.onclick=async()=>{if(!confirm('Toegang intrekken?'))return;await call('/api/v1/admin?resource=revoke',{method:'POST',body:JSON.stringify({clerkUserId:b.dataset.id})});load()})}async function load(){try{render(await call('/api/v1/admin'));notice.hidden=true;app.hidden=false;login.textContent='Uitloggen'}catch(e){notice.textContent=e.message.includes('Beheerdersrechten')?'Dit account heeft geen beheerdersrechten.':'Inloggen als beheerder is vereist.';notice.className='notice error';login.textContent='Inloggen als beheerder'}}login.onclick=async()=>login.textContent==='Uitloggen'?(await mtSignOut(),location.reload()):mtOpenAuth('sign-in');window.addEventListener('load',()=>mtClerkReady.then(load).catch(()=>{}));</script></body></html>
