<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mursaltheorie beheer</title><script src="/clerk-auth.js"></script><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eef2ff;background:#07112f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#35158a,#07112f 55%);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:28px 18px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.6rem)}.sub{color:#b8c5ee;margin-top:5px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;background:#7c3aed;color:white}.btn.alt{background:#182b5d}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card,.panel{background:#101f49d9;border:1px solid #38528f;border-radius:18px;padding:18px}.card strong{display:block;font-size:2rem;color:#c4b5fd}.panel{overflow:auto}.notice{padding:16px;border-radius:14px;background:#132a5d;margin:15px 0;color:#dbeafe}.error{background:#5b1b3a;color:#ffe4e6}.user{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:12px;align-items:center;border-top:1px solid #2d4479;padding:15px 0;min-width:760px}.muted{color:#aab9e3;font-size:.9rem}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#273e7a;font-size:.78rem}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:.82rem;padding:8px 10px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.cards .card:last-child{grid-column:span 2}header{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header><div><h1>Beheerderspaneel</h1><div class="sub">Betalingen, gebruikers en cursus toegang</div></div><button class="btn alt" id="login">Inloggen</button></header><div id="notice" class="notice">Beveiligde beheeromgeving laden…</div><section id="app" hidden><div class="cards"><div class="card"><span>Gebruikers</span><strong id="countUsers">–</strong></div><div class="card"><span>Beheerders</span><strong id="countAdmins">–</strong></div><div class="card"><span>Betaalde orders</span><strong id="countPaid">–</strong></div></div><div class="panel"><h2>Gebruikers</h2><p class="muted">Geef alleen toegang nadat je de betaalde Mollie-order hebt gecontroleerd.</p><div id="users"></div></div></section></main><script>
const notice=document.querySelector('#notice'),app=document.querySelector('#app'),login=document.querySelector('#login');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function fmt(v){return v?new Date(v).toLocaleDateString('nl-NL'):'–'}
async function token(){const clerk=await window.mtClerkReady;return clerk.session?.getToken()}
async function call(url,options={}){const t=await token();const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`}});const j=await r.json();if(!r.ok)throw new Error(j?.error?.message||'Actie mislukt');return j.data}
function render(data){document.querySelector('#countUsers').textContent=data.counts.users;document.querySelector('#countAdmins').textContent=data.counts.admins;document.querySelector('#countPaid').textContent=data.counts.paid_orders;document.querySelector('#users').innerHTML=data.users.map(u=>{const paid=['paid_awaiting_activation','active'].includes(u.latest_purchase_status);return `<div class="user"><div><strong>${esc(u.display_name||'Onbekend')}</strong><div class="muted">${esc(u.email||'Geen e-mail')}<br><span class="tag">${esc(u.access_status)}</span></div></div><div><div>${esc(u.latest_description||'Geen bestelling')}</div><div class="muted">${u.latest_amount?'€ '+esc(u.latest_amount):''} · ${esc(u.latest_purchase_status||'–')}</div></div><div><div>${u.entitlement_product_key?esc(u.entitlement_product_key):'Geen toegang'}</div><div class="muted">tot ${fmt(u.entitlement_ends_at)}</div></div><div class="actions"><button class="btn small grant" data-id="${esc(u.clerk_user_id)}" ${paid?'':'title="Controleer eerst de betaling"'}>Geef toegang</button><button class="btn alt small revoke" data-id="${esc(u.clerk_user_id)}">Blokkeer</button></div></div>`}).join('')||'<p class="muted">Nog geen gebruikers.</p>';document.querySelectorAll('.grant').forEach(b=>b.onclick=async()=>{if(!confirm('Geef deze gebruiker 30 dagen toegang?'))return;await call('/api/v1/admin?resource=grant',{method:'POST',body:JSON.stringify({clerkUserId:b.dataset.id,productKey:'theory_b_nl_fa_30d',days:30})});load()});document.querySelectorAll('.revoke').forEach(b=>b.onclick=async()=>{if(!confirm('Toegang intrekken?'))return;await call('/api/v1/admin?resource=revoke',{method:'POST',body:JSON.stringify({clerkUserId:b.dataset.id})});load()})}
async function load(){try{const data=await call('/api/v1/admin');notice.hidden=true;app.hidden=false;login.textContent='Uitloggen';render(data)}catch(e){notice.textContent=e.message.includes('Beheerdersrechten')?'Dit account heeft geen beheerdersrechten.':'Inloggen als beheerder is vereist.';notice.className='notice error';login.textContent='Inloggen als beheerder';}}
login.onclick=async()=>{if(login.textContent==='Uitloggen'){await window.mtSignOut();location.reload()}else await window.mtOpenAuth('sign-in')};window.addEventListener('load',()=>window.mtClerkReady.then(load).catch(()=>{}));
</script></body></html>
