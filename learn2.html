 naar links gaat.';tip='Doorgetrokken strepen en verboden kunnen inhalen uitsluiten.';mistake='Inhalen omdat de voorligger langzaam rijdt zonder verder te kijken.';q='Wanneer mag je inhalen?';ans=['Als het veilig en toegestaan is','Altijd links','Bij elk kruispunt']}else if(x.includes('fiet')||x.includes('voetg')||x.includes('kind')||x.includes('ouderen')){rule='Kwetsbare weggebruikers krijgen extra ruimte en tijd. Houd rekening met onverwachte bewegingen.';example='Bij kinderen of fietsers verminder je snelheid en ben je klaar om te remmen.';tip='Denk niet alleen aan recht, maar ook aan risico.';mistake='Aannemen dat de ander jou gezien heeft.';q='Wat is verstandig bij kwetsbare weggebruikers?';ans=['Meer ruimte en lagere snelheid','Dichter langsrijden','Claxonneren en versnellen']}else if(x.includes('alcohol')||x.includes('drugs')||x.includes('medic')||x.includes('vermoeid')||x.includes('smartphone')||x.includes('afleiding')){rule='Rij alleen wanneer je lichamelijk en geestelijk veilig kunt deelnemen aan het verkeer.';example='Stop als vermoeidheid of middelen je reactievermogen beïnvloeden.';tip='De veilige keuze is altijd de keuze die afleiding en beperking voorkomt.';mistake='Denken dat een korte rit wel kan.';q='Wat doe je als je niet rijgeschikt bent?';ans=['Toch rustig rijden','Niet rijden of veilig stoppen','Sneller naar huis']}else if(x.includes('band')||x.includes('verlichting')||x.includes('koelvloeistof')){rule='Je voertuig moet technisch veilig zijn. Controleer banden, verlichting en waarschuwingssignalen op tijd.';example='Een beschadigde of te zachte band kan grip en remgedrag verslechteren.';tip='Techniekvragen gaan meestal over risico voorkomen.';mistake='Een waarschuwing negeren zolang de auto nog rijdt.';q='Waarom controleer je het voertuig?';ans=['Voor veiligheid','Alleen voor uiterlijk','Alleen voor brandstof']}else if(x.includes('voorrang')||x.includes('kruispunt')||x.includes('rechts heeft')){rule='Bepaal eerst welke regeling geldt: aanwijzingen, verkeerslichten, borden en daarna de gewone voorrangsregels.';example='Een gelijkwaardig kruispunt zonder regeling vraagt extra aandacht voor verkeer van rechts.';tip='Lees de hele kruising, niet één voertuig.';mistake='Een bord of haaientanden missen.';q='Wat bekijk je eerst op een kruispunt?';ans=['De volledige regeling en situatie','Alleen de kleur van auto’s','Alleen je eigen richting']}else{rule='Bij '+l.title+' beoordeel je eerst de verkeerssituatie, de geldende regel en het mogelijke gevaar voordat je handelt.';example='Kijk ruim vooruit, pas snelheid en positie aan en voer de handeling pas uit wanneer dat veilig kan.';tip='Op het examen is de veiligste én juridisch juiste keuze belangrijk.';mistake='Te snel antwoorden op basis van één detail.';q='Wat is de beste eerste stap bij '+l.title+'?';ans=['De hele situatie beoordelen','Direct handelen','Altijd stoppen']}return{rule,example,tip,mistake,q,ans,c:1}}function nav(){let a=[['dashboard','Dashboard'],['lessons','Lessen'],['words','Woorden'],['hazard','Training'],['exams','Examens']];return`<header class="top"><div class="logo" onclick="location.href='/'"><i>M</i><span>Mursaltheorie</span></div><div class="nav">${a.map(x=>`<button class="${S.view===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="lang"><button class="${S.lang==='nl'?'on':''}" onclick="setLang('nl')">NL</button><button class="${S.lang==='fa'?'on':''}" onclick="setLang('fa')">دری</button></div><button class="user" onclick="${S.user?"go('profile')":"openAuth('login')"}">${S.user?'👤 '+S.user.name:t('Inloggen','ورود')}</button></header>`}function mobile(){let a=[['dashboard','⌂'],['lessons','📘'],['words','🔤'],['hazard','⚡'],['exams','✓']];return`<nav class="mobile">${a.map(x=>`<button class="${S.view===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}<br>${x[0]}</button>`).join('')}</nav>`}function quick(){let a=[['lessons','📘','150 theorielessen'],['words','🔤','NL ↔ Dari/Farsi'],['hazard','⚡','Situatietraining'],['exams','✅','30 oefenexamens'],['profile','👤','Profiel & voortgang'],['dashboard','⌂','Overzicht']];return`<div class="quick">${a.map(x=>`<button onclick="${x[0]==='profile'&&!S.user?"openAuth('login')":`go('${x[0]}')`}"><b>${x[1]} ${x[2]}</b><span>${t('Tik om te openen','برای باز کردن بزنید')}</span></button>`).join('')}</div>`}function dashboard(){let d=done();return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><section class="hero"><div class="card pad"><span class="pill">Auto Theorie B</span><h1>${S.user?t('Welkom terug, ','خوش آمدید، ')+S.user.name:t('Klaar om te leren?','آماده یادگیری هستید؟')}</h1><p class="mut">${t('Kies een onderdeel. Alles is in kleine, duidelijke stappen opgebouwd.','یک بخش را انتخاب کنید. همه چیز قدم‌به‌قدم ساخته شده است.')}</p><div class="row"><button class="primary" onclick="go('lessons')">▶ ${t('Verder met lessen','ادامه درس‌ها')}</button></div></div><div class="card pad stats"><div class="stat"><b>${d}</b><span>${t('lessen klaar','درس کامل')}</span></div><div class="stat"><b>${Math.round(d/1.5)}%</b><span>${t('voortgang','پیشرفت')}</span></div><div class="stat"><b>150</b><span>${t('lessen','درس')}</span></div><div class="stat"><b>30</b><span>${t('examens','امتحان')}</span></div></div></section><div class="head"><div><h2>${t('Wat wil je oefenen?','چه می‌خواهید تمرین کنید؟')}</h2></div></div>${quick()}</main>`}function lessons(){let list=all().filter(l=>l.m===S.mod);return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><div><h1>${t('Theorielessen','درس‌های تیوری')}</h1><div class="mut">${t('15 modules • 10 lessen per module','۱۵ بخش • ۱۰ درس در هر بخش')}</div></div></div><div class="chips">${MOD.map((m,i)=>`<button class="${S.mod===i+1?'on':''}" onclick="S.mod=${i+1};render()">${i+1}. ${S.lang==='fa'?FA[i]:m[0]}</button>`).join('')}</div><div class="grid" style="margin-top:10px">${list.map(l=>`<article class="card lesson"><div class="pic"><img loading="lazy" src="images/${encodeURIComponent(pickImg(l.title,l.id))}"></div><h3>${l.id}. ${l.title}</h3><span class="pill">${isDone(l.id)?'✓ '+t('Geleerd','یاد گرفتم'):t('Les','درس')}</span><div class="row"><span class="mut" style="font-size:12px">${S.lang==='fa'?FA[l.m-1]:l.cat}</span><button class="mini" onclick="openLesson(${l.id})">${t('Open les','باز کردن')}</button></div></article>`).join('')}</div><div class="pager"><button class="ghost" onclick="setMod(S.mod-1)" ${S.mod===1?'disabled':''}>←</button><b>${S.mod}/15</b><button class="ghost" onclick="setMod(S.mod+1)" ${S.mod===15?'disabled':''}>→</button></div></main>`}function openLesson(id){S.lesson=L(id);S.la=null;render()}function lessonModal(){if(!S.lesson)return'';let l=S.lesson,d=detail(l);return`<div class="overlay" onclick="if(event.target===this){S.lesson=null;render()}"><section class="modal ${S.lang==='fa'?'rtl':''}"><div class="mhead"><button class="ghost" onclick="S.lesson=null;render()">✕</button><b>${l.id}. ${l.title}</b></div><div class="mbody"><div class="pic" style="height:250px"><img src="images/${encodeURIComponent(pickImg(l.title,l.id))}"></div><div class="boxes"><div class="box"><h4>${t('Kernregel','قانون اصلی')}</h4><p>${t(d.rule,'قانون اصلی این موضوع را یاد بگیرید و تمام وضعیت ترافیک را بررسی کنید.')}</p></div><div class="box"><h4>${t('Praktijkvoorbeeld','مثال عملی')}</h4><p>${t(d.example,'در عمل ابتدا نگاه کنید، سرعت را تنظیم کنید و سپس با ایمنی عمل کنید.')}</p></div><div class="box"><h4>${t('Examentip','نکته امتحان')}</h4><p>${t(d.tip,'در امتحان اول علایم، خط‌کشی، حق تقدم و خطر را پیدا کنید.')}</p></div><div class="box"><h4>${t('Veelgemaakte fout','اشتباه رایج')}</h4><p>${t(d.mistake,'خیلی سریع تصمیم نگیرید و تمام وضعیت را ببینید.')}</p></div></div><div class="box" style="margin-top:9px"><h4>${t('Oefenvraag','سوال تمرینی')}</h4><p>${t(d.q,'بهترین انتخاب چیست؟')}</p>${d.ans.map((a,i)=>`<button class="ans ${S.la==null?'':i===d.c?'good':S.la===i?'bad':''}" onclick="S.la=${i};render()">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}${S.la!=null?`<p class="mut">${S.la===d.c?t('Goed. Lees de kernregel nog één keer en ga verder.','درست است. قانون اصلی را یک بار دیگر بخوانید.'):t('Niet juist. Kijk opnieuw naar de kernregel.','درست نیست. دوباره قانون اصلی را ببینید.')}</p>`:''}</div><div class="row"><button class="primary" onclick="toggle(${l.id})">${isDone(l.id)?'✓ '+t('Geleerd','یاد گرفتم'):t('Markeer als geleerd','علامت یادگرفته')}</button></div></div></section></div>`}function words(){let per=12,st=S.wp*per,sub=WORD.slice(st,st+per),max=Math.ceil(WORD.length/per);return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h1>${t('Verkeerswoorden','واژه‌های ترافیکی')}</h1></div><div class="words">${sub.map(w=>`<div class="word"><span>${w[0]}</span><b>${w[1]}</b></div>`).join('')}</div><div class="pager"><button class="ghost" onclick="S.wp=Math.max(0,S.wp-1);render()">←</button><b>${S.wp+1}/${max}</b><button class="ghost" onclick="S.wp=Math.min(${max-1},S.wp+1);render()">→</button></div></main>`}const H=[['Een kind staat vlak bij de rijbaan.','rem'],['Je ziet ver vooruit een rood verkeerslicht.','gas'],['De weg is vrij en er is geen direct gevaar.','nothing'],['Een auto remt plots voor je.','rem'],['Je nadert rustig een rotonde met verkeer.','gas'],['Een fietser wijkt onverwacht uit.','rem']];function hazard(){let i=+(localStorage.getItem('hi')||0)%H.length,h=H[i];return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h1>${t('Situatietraining','تمرین موقعیت')}</h1></div><section class="card pad"><div class="pic" style="height:300px"><img src="images/${encodeURIComponent(pickImg(h[0],i))}"></div><h2>${h[0]}</h2><p class="mut">${t('Kies wat je als bestuurder als eerste doet.','انتخاب کنید که راننده اول چه می‌کند.')}</p><div class="row" style="justify-content:flex-start;flex-wrap:wrap">${[['rem','Remmen','ترمز'],['gas','Gas los','رها کردن گاز'],['nothing','Niets','هیچ']].map(x=>`<button class="primary" onclick="haz('${x[0]}','${h[1]}')">${t(x[1],x[2])}</button>`).join('')}</div><div id="hm"></div></section></main>`}function haz(a,c){hm.innerHTML=`<div class="box" style="margin-top:10px">${a===c?t('✓ Goed','✓ درست'):t('Niet juist — probeer opnieuw','درست نیست — دوباره کوشش کنید')}</div>`;if(a===c){localStorage.setItem('hi',(+(localStorage.getItem('hi')||0)+1)%H.length);setTimeout(render,650)}}const Q=[['Je nadert haaientanden. Wat doe je?',['Voorrang verlenen','Doorrijden','Claxonneren'],0],['Wat doe je vóór een rijstrookwissel?',['Alleen richting aangeven','Spiegels en dode hoek controleren','Harder rijden'],1],['Wat gebeurt met de remweg bij hogere snelheid?',['Wordt langer','Wordt korter','Blijft gelijk'],0],['Waarvoor dient een zebrapad?',['Parkeren','Oversteken voor voetgangers','Inhalen'],1],['Wat is veilig bij vermoeidheid?',['Stoppen en rusten','Raam open','Sneller rijden'],0],['Wat doe je bij een ambulance met signalen?',['Ruimte geven','Links blijven','Op rijbaan stoppen'],0]];function exams(){let st=S.ep*6;return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h1>${t('30 oefenexamens','۳۰ امتحان تمرینی')}</h1></div><div class="grid">${Array.from({length:6},(_,j)=>`<div class="card pad"><span class="pill">${t('Examen','امتحان')} ${st+j+1}</span><h2>50 ${t('vragen','سوال')}</h2><p class="mut">30 ${t('minuten','دقیقه')}</p><button class="primary" onclick="startExam(${st+j+1})">${t('Start examen','شروع امتحان')}</button></div>`).join('')}</div><div class="pager"><button class="ghost" onclick="S.ep=Math.max(0,S.ep-1);render()">←</button><b>${S.ep+1}/5</b><button class="ghost" onclick="S.ep=Math.min(4,S.ep+1);render()">→</button></div></main>`}function startExam(n){S.exam={n,i:0,a:Array(50).fill(null),r:1800};render();S.exam.timer=setInterval(()=>{if(!S.exam)return;S.exam.r--;let e=document.getElementById('timer');if(e)e.textContent=time(S.exam.r);if(S.exam.r<=0)finish()},1000)}function time(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function qAt(i,n){let q=Q[(i+n)%Q.length];return{q:q[0],a:q[1],c:q[2],im:pickImg(q[0],i+n)}}function examView(){let e=S.exam,q=qAt(e.i,e.n);return`<div class="exam"><div class="examtop"><button class="ghost" onclick="closeExam()">✕</button><b>${e.i+1}/50</b><div class="bar"><i style="width:${(e.i+1)*2}%"></i></div><b id="timer">${time(e.r)}</b></div><main class="examc"><section class="card question"><div class="pic" style="height:min(34vh,250px)"><img src="images/${encodeURIComponent(q.im)}"></div><h2>${q.q}</h2>${q.a.map((a,i)=>`<button class="ans ${e.a[e.i]===i?'good':''}" onclick="S.exam.a[S.exam.i]=${i};render()">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div class="pager"><button class="ghost" onclick="S.exam.i=Math.max(0,S.exam.i-1);render()" ${e.i===0?'disabled':''}>←</button>${e.i===49?`<button class="primary" onclick="finish()">${t('Inleveren','تحویل')}</button>`:`<button class="primary" onclick="S.exam.i++;render()">${t('Volgende','بعدی')} →</button>`}</div></section></main></div>`}function finish(){clearInterval(S.exam.timer);let sc=0;for(let i=0;i<50;i++)if(S.exam.a[i]===qAt(i,S.exam.n).c)sc++;alert('Score: '+sc+'/50');S.exam=null;render()}function closeExam(){if(S.exam?.timer)clearInterval(S.exam.timer);S.exam=null;render()}function profile(){if(!S.user){openAuth('login');return''}return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><section class="card pad"><h1>👤 ${S.user.name}</h1><p class="mut">${S.user.email}</p><div class="stats"><div class="stat"><b>${done()}</b><span>${t('lessen klaar','درس کامل')}</span></div><div class="stat"><b>${Math.round(done()/1.5)}%</b><span>${t('voortgang','پیشرفت')}</span></div></div><div class="row"><button class="primary" onclick="go('dashboard')">Dashboard</button><button class="ghost" onclick="logout()">${t('Uitloggen','خروج')}</button></div></section></main>`}function authView(){if(!S.auth)return'';let reg=S.mode==='register';return`<div class="auth"><section class="authbox ${S.lang==='fa'?'rtl':''}"><div class="logo"><i>M</i><span>Mursaltheorie</span></div><h2>${t('Welkom','خوش آمدید')}</h2><div class="tabs"><button class="${!reg?'on':''}" onclick="S.mode='login';render()">${t('Inloggen','ورود')}</button><button class="${reg?'on':''}" onclick="S.mode='register';render()">${t('Account maken','ساخت حساب')}</button></div>${reg?`<div class="field"><label>${t('Naam','نام')}</label><input id="name"></div>`:''}<div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>${t('Wachtwoord','رمز')}</label><input id="pass" type="password"></div><button class="primary" style="width:100%" onclick="submitAuth()">${reg?t('Account maken','ساخت حساب'):t('Inloggen','ورود')}</button><button class="ghost" style="width:100%;margin-top:8px" onclick="S.auth=false;render()">${t('Terug','بازگشت')}</button><p class="mut" style="font-size:11px">${t('Testaccount: echte veilige accounts volgen in de backend-fase.','حساب آزمایشی: حساب امن واقعی در مرحله بعد می‌آید.')}</p></section></div>`}function submitAuth(){let e=email.value.trim(),p=pass.value,n=document.getElementById('name')?.value.trim()||e.split('@')[0];if(!e.includes('@')||p.length<4){alert('Controleer e-mail en wachtwoord');return}S.user={email:e,name:n};localStorage.setItem('mt-user',JSON.stringify(S.user));S.auth=false;S.view='dashboard';render()}function openAuth(m){S.mode=m;S.auth=true;render()}function logout(){localStorage.removeItem('mt-user');S.user=null;go('dashboard')}function setLang(l){S.lang=l;localStorage.setItem('mt-lang',l);render()}function setMod(m){if(m<1||m>15)return;S.mod=m;render();scrollTo(0,0)}function go(v){S.view=v;render();scrollTo(0,0)}function done(){return JSON.parse(localStorage.getItem('mt-done')||'[]').length}function isDone(id){return JSON.parse(localStorage.getItem('mt-done')||'[]').includes(id)}function toggle(id){let a=JSON.parse(localStorage.getItem('mt-done')||'[]');a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('mt-done',JSON.stringify(a));render()}function render(){document.documentElement.dir=S.lang==='fa'?'rtl':'ltr';app.innerHTML=S.exam?examView():nav()+({dashboard,lessons,words,hazard,exams,profile}[S.view]||dashboard)()+mobile()+lessonModal()+authView()}render();</script></body></html>
