snelheid onderschatten.',q:'Wat gebeurt met de remweg bij hogere snelheid?',ans:['Wordt langer','Wordt korter','Blijft gelijk'],c:0};else if(x.includes('fiet')||x.includes('voetg')||x.includes('kind'))d={rule:'Kwetsbare weggebruikers krijgen extra ruimte, tijd en voorzichtigheid.',example:'Verminder snelheid en wees klaar om te remmen.',tip:'Ga er niet vanuit dat de ander jou gezien heeft.',mistake:'Te dicht of te snel passeren.',q:'Wat is verstandig bij kwetsbare weggebruikers?',ans:['Meer ruimte en lagere snelheid','Dichter langsrijden','Versnellen'],c:0};return d}function nav(){let a=['dashboard','lessons','words','hazard','exams'];return`<header class="top"><div class="logo" onclick="location.href='/'"><i>M</i><span>Mursaltheorie</span></div><div class="nav">${a.map(v=>`<button class="${S.view===v?'on':''}" onclick="go('${v}')">${u(v)}</button>`).join('')}</div><div class="lang"><button class="${S.lang==='nl'?'on':''}" onclick="setLang('nl')">NL</button><button class="${S.lang==='fa'?'on':''}" onclick="setLang('fa')">دری</button></div><button class="user" onclick="${S.user?"go('profile')":"openAuth('login')"}">${S.user?'👤 '+S.user.name:u('login')}</button></header>`}function mobile(){let a=[['dashboard','⌂'],['lessons','📘'],['words','🔤'],['hazard','⚡'],['exams','✓']];return`<nav class="mobile">${a.map(x=>`<button class="${S.view===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}<br>${u(x[0])}</button>`).join('')}</nav>`}function quick(){let a=[['lessons','📘',t('150 theorielessen','۱۵۰ درس تیوری')],['words','🔤','NL ↔ دری/فارسی'],['hazard','⚡',u('situation')],['exams','✅',u('practiceexams')],['profile','👤',u('profile')],['dashboard','⌂',u('dashboard')]];return`<div class="quick">${a.map(x=>`<button onclick="${x[0]==='profile'&&!S.user?"openAuth('login')":`go('${x[0]}')`}"><b>${x[1]} ${x[2]}</b><span>${t('Tik om te openen','برای باز کردن بزنید')}</span></button>`).join('')}</div>`}function dashboard(){let d=done();return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><section class="hero"><div class="card pad"><span class="pill">Auto Theorie B</span><h1>${S.user?t('Welkom terug, ','خوش آمدید، ')+S.user.name:u('welcome')}</h1><p class="mut">${u('choose')}</p><div class="row"><button class="primary" onclick="go('lessons')">▶ ${u('continue')}</button></div></div><div class="card pad stats"><div class="stat"><b>${d}</b><span>${t('lessen klaar','درس کامل')}</span></div><div class="stat"><b>${Math.round(d/1.5)}%</b><span>${t('voortgang','پیشرفت')}</span></div><div class="stat"><b>150</b><span>${t('lessen','درس')}</span></div><div class="stat"><b>30</b><span>${t('examens','امتحان')}</span></div></div></section><div class="head"><h2>${u('practice')}</h2></div>${quick()}</main>`}function lessons(){let list=all().filter(l=>l.m===S.mod);return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><div><h1>${u('theory')}</h1><div class="mut">${u('modules')}</div></div></div><div class="chips">${MOD.map((m,i)=>`<button class="${S.mod===i+1?'on':''}" onclick="S.mod=${i+1};render()">${i+1}. ${S.lang==='fa'?FA_MOD[i]:m[0]}</button>`).join('')}</div><div class="grid" style="margin-top:10px">${list.map(l=>`<article class="card lesson"><div class="pic"><img loading="lazy" src="/images/${encodeURIComponent(pickImg(l.title,l.id))}" onerror="this.onerror=null;this.src='/images/${encodeURIComponent(IMG[0])}'"></div><h3>${l.id}. ${l.title}</h3><span class="pill">${isDone(l.id)?'✓ '+u('learned'):u('lesson')}</span><div class="row"><span class="mut" style="font-size:12px">${S.lang==='fa'?FA_MOD[l.m-1]:l.cat}</span><button class="mini" onclick="openLesson(${l.id})">${u('open')}</button></div></article>`).join('')}</div><div class="pager"><button class="ghost" onclick="setMod(S.mod-1)" ${S.mod===1?'disabled':''}>←</button><b>${S.mod}/15</b><button class="ghost" onclick="setMod(S.mod+1)" ${S.mod===15?'disabled':''}>→</button></div></main>`}function openLesson(id){S.lesson=L(id);S.la=null;render()}function lessonModal(){if(!S.lesson)return'';let l=S.lesson,d=detail(l);return`<div class="overlay" onclick="if(event.target===this){S.lesson=null;render()}"><section class="modal ${S.lang==='fa'?'rtl':''}"><div class="mhead"><button class="ghost" onclick="S.lesson=null;render()">✕</button><b>${l.id}. ${l.title}</b></div><div class="mbody"><div class="pic" style="height:260px"><img src="/images/${encodeURIComponent(pickImg(l.title,l.id))}" onerror="this.onerror=null;this.src='/images/${encodeURIComponent(IMG[0])}'"></div><div class="boxes"><div class="box"><h4>${u('rule')}</h4><p>${t(d.rule,'قانون اصلی این موضوع را یاد بگیرید و تمام وضعیت ترافیک را بررسی کنید.')}</p></div><div class="box"><h4>${u('example')}</h4><p>${t(d.example,'در عمل ابتدا نگاه کنید، سرعت را تنظیم کنید و سپس با ایمنی عمل کنید.')}</p></div><div class="box"><h4>${u('tip')}</h4><p>${t(d.tip,'در امتحان اول علایم، خط‌کشی، حق تقدم و خطر را پیدا کنید.')}</p></div><div class="box"><h4>${u('mistake')}</h4><p>${t(d.mistake,'خیلی سریع تصمیم نگیرید و تمام وضعیت را ببینید.')}</p></div></div><div class="box" style="margin-top:9px"><h4>${u('question')}</h4><p>${t(d.q,'بهترین انتخاب چیست؟')}</p>${d.ans.map((a,i)=>`<button class="ans ${S.la==null?'':i===d.c?'good':S.la===i?'bad':''}" onclick="S.la=${i};render()">${String.fromCharCode(65+i)}. ${S.lang==='fa'?[ 'تمام وضعیت را بررسی کنید','فوراً عمل کنید','همیشه توقف کنید'][i]||a:a}</button>`).join('')}</div><div class="row"><button class="primary" onclick="toggle(${l.id})">${isDone(l.id)?'✓ '+u('learned'):u('mark')}</button></div></div></section></div>`}function words(){let per=12,st=S.wp*per,sub=WORD.slice(st,st+per),max=Math.ceil(WORD.length/per);return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h1>${u('trafficwords')}</h1></div><div class="words">${sub.map(w=>`<div class="word"><span>${w[0]}</span><b>${w[1]}</b></div>`).join('')}</div><div class="pager"><button class="ghost" onclick="S.wp=Math.max(0,S.wp-1);render()">←</button><b>${S.wp+1}/${max}</b><button class="ghost" onclick="S.wp=Math.min(${max-1},S.wp+1);render()">→</button></div></main>`}const H=[['Een kind staat vlak bij de rijbaan.','یک کودک نزدیک جاده ایستاده است.','rem'],['Je ziet ver vooruit een rood verkeerslicht.','از دور چراغ سرخ را می‌بینید.','gas'],['De weg is vrij en er is geen direct gevaar.','جاده آزاد است و خطر فوری وجود ندارد.','nothing'],['Een auto remt plots voor je.','موتر جلوی شما ناگهان ترمز می‌کند.','rem']];function hazard(){let i=+(localStorage.getItem('hi')||0)%H.length,h=H[i];return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h1>${u('situation')}</h1></div><section class="card pad"><div class="pic" style="height:300px"><img src="/images/${encodeURIComponent(pickImg(h[0],i))}" onerror="this.onerror=null;this.src='/images/${encodeURIComponent(IMG[0])}'"></div><h2>${S.lang==='fa'?h[1]:h[0]}</h2><p class="mut">${u('chooseaction')}</p><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="primary" onclick="haz('rem','${h[2]}')">${u('brake')}</button><button class="primary" onclick="haz('gas','${h[2]}')">${u('gas')}</button><button class="primary" onclick="haz('nothing','${h[2]}')">${u('nothing')}</button></div><div id="hm"></div></section></main>`}function haz(a,c){hm.innerHTML=`<div class="box" style="margin-top:10px">${a===c?t('✓ Goed','✓ درست'):t('Niet juist — probeer opnieuw','درست نیست — دوباره کوشش کنید')}</div>`;if(a===c){localStorage.setItem('hi',(+(localStorage.getItem('hi')||0)+1)%H.length);setTimeout(render,650)}}const Q=[['Je nadert haaientanden. Wat doe je?','به خطوط مثلثی نزدیک می‌شوید. چه می‌کنید؟',['Voorrang verlenen','Doorrijden','Claxonneren'],['حق تقدم بدهید','عبور کنید','بوق بزنید'],0],['Wat doe je vóór een rijstrookwissel?','پیش از تغییر خط چه می‌کنید؟',['Spiegels en dode hoek controleren','Alleen richting aangeven','Harder rijden'],['آینه‌ها و نقطه کور را بررسی کنید','فقط راهنما بزنید','سرعت را زیاد کنید'],0],['Wat gebeurt met de remweg bij hogere snelheid?','با سرعت بیشتر فاصله ترمز چه می‌شود؟',['Wordt langer','Wordt korter','Blijft gelijk'],['بیشتر می‌شود','کمتر می‌شود','یکسان می‌ماند'],0]];function exams(){let st=S.ep*6;return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h1>${u('practiceexams')}</h1></div><div class="grid">${Array.from({length:6},(_,j)=>`<div class="card pad"><span class="pill">${u('exam')} ${st+j+1}</span><h2>50 ${u('questions')}</h2><p class="mut">30 ${u('minutes')}</p><button class="primary" onclick="startExam(${st+j+1})">${u('startexam')}</button></div>`).join('')}</div><div class="pager"><button class="ghost" onclick="S.ep=Math.max(0,S.ep-1);render()">←</button><b>${S.ep+1}/5</b><button class="ghost" onclick="S.ep=Math.min(4,S.ep+1);render()">→</button></div></main>`}function startExam(n){S.exam={n,i:0,a:Array(50).fill(null),r:1800};render();S.exam.timer=setInterval(()=>{if(!S.exam)return;S.exam.r--;let e=document.getElementById('timer');if(e)e.textContent=time(S.exam.r);if(S.exam.r<=0)finish()},1000)}function time(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function qAt(i,n){let q=Q[(i+n)%Q.length];return{q:S.lang==='fa'?q[1]:q[0],a:S.lang==='fa'?q[3]:q[2],c:q[4],im:pickImg(q[0],i+n)}}function examView(){let e=S.exam,q=qAt(e.i,e.n);return`<div class="exam ${S.lang==='fa'?'rtl':''}"><div class="examtop"><button class="ghost" onclick="closeExam()">✕</button><b>${e.i+1}/50</b><div class="bar"><i style="width:${(e.i+1)*2}%"></i></div><b id="timer">${time(e.r)}</b></div><main class="examc"><section class="card question"><div class="pic" style="height:min(34vh,250px)"><img src="/images/${encodeURIComponent(q.im)}" onerror="this.onerror=null;this.src='/images/${encodeURIComponent(IMG[0])}'"></div><h2>${q.q}</h2>${q.a.map((a,i)=>`<button class="ans ${e.a[e.i]===i?'good':''}" onclick="S.exam.a[S.exam.i]=${i};render()">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div class="pager"><button class="ghost" onclick="S.exam.i=Math.max(0,S.exam.i-1);render()" ${e.i===0?'disabled':''}>←</button>${e.i===49?`<button class="primary" onclick="finish()">${u('submit')}</button>`:`<button class="primary" onclick="S.exam.i++;render()">${u('next')} →</button>`}</div></section></main></div>`}function finish(){clearInterval(S.exam.timer);let sc=0;for(let i=0;i<50;i++)if(S.exam.a[i]===qAt(i,S.exam.n).c)sc++;alert(t('Score: ','امتیاز: ')+sc+'/50');S.exam=null;render()}function closeExam(){if(S.exam?.timer)clearInterval(S.exam.timer);S.exam=null;render()}function profile(){if(!S.user){openAuth('login');return''}return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><section class="card pad"><h1>👤 ${S.user.name}</h1><p class="mut">${S.user.email}</p><div class="stats"><div class="stat"><b>${done()}</b><span>${t('lessen klaar','درس کامل')}</span></div><div class="stat"><b>${Math.round(done()/1.5)}%</b><span>${t('voortgang','پیشرفت')}</span></div></div><div class="row"><button class="primary" onclick="go('dashboard')">${u('dashboard')}</button><button class="ghost" onclick="logout()">${u('logout')}</button></div></section></main>`}function authView(){if(!S.auth)return'';let reg=S.mode==='register';return`<div class="auth"><section class="authbox ${S.lang==='fa'?'rtl':''}"><div class="logo"><i>M</i><span>Mursaltheorie</span></div><h2>${t('Welkom','خوش آمدید')}</h2><div class="tabs"><button class="${!reg?'on':''}" onclick="S.mode='login';render()">${u('login')}</button><button class="${reg?'on':''}" onclick="S.mode='register';render()">${t('Account maken','ساخت حساب')}</button></div>${reg?`<div class="field"><label>${t('Naam','نام')}</label><input id="name"></div>`:''}<div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>${t('Wachtwoord','رمز')}</label><input id="pass" type="password"></div><button class="primary" style="width:100%" onclick="submitAuth()">${reg?t('Account maken','ساخت حساب'):u('login')}</button><button class="ghost" style="width:100%;margin-top:8px" onclick="S.auth=false;render()">${t('Terug','بازگشت')}</button></section></div>`}function submitAuth(){let e=email.value.trim(),p=pass.value,n=document.getElementById('name')?.value.trim()||e.split('@')[0];if(!e.includes('@')||p.length<4){alert(t('Controleer e-mail en wachtwoord','ایمیل و رمز را بررسی کنید'));return}S.user={email:e,name:n};localStorage.setItem('mt-user',JSON.stringify(S.user));S.auth=false;S.view='dashboard';render()}function openAuth(m){S.mode=m;S.auth=true;render()}function logout(){localStorage.removeItem('mt-user');S.user=null;go('dashboard')}function setLang(l){S.lang=l;localStorage.setItem('mt-lang',l);document.documentElement.lang=l==='fa'?'fa':'nl';document.documentElement.dir=l==='fa'?'rtl':'ltr';render()}function setMod(m){if(m<1||m>15)return;S.mod=m;render();scrollTo(0,0)}function go(v){S.view=v;render();scrollTo(0,0)}function done(){return JSON.parse(localStorage.getItem('mt-done')||'[]').length}function isDone(id){return JSON.parse(localStorage.getItem('mt-done')||'[]').includes(id)}function toggle(id){let a=JSON.parse(localStorage.getItem('mt-done')||'[]');a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('mt-done',JSON.stringify(a));render()}function render(){document.documentElement.lang=S.lang==='fa'?'fa':'nl';document.documentElement.dir=S.lang==='fa'?'rtl':'ltr';app.innerHTML=S.exam?examView():nav()+({dashboard,lessons,words,hazard,exams,profile}[S.view]||dashboard)()+mobile()+lessonModal()+authView()}render();</script></body></html>
