function dashboard(){const done=doneCount();return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('Jouw dashboard','داشبورد شما')}</h2><p>${t('Snelle toegang zonder veel scrollen.','دسترسی سریع بدون اسکرول زیاد.')}</p></div></div><div class="dash-grid"><section class="card panel"><div class="mini-grid"><div class="stat"><b>${state.plan==='fa'?'NL + FA':'NL'}</b><span>${t('Gekozen pakket','پلان انتخاب‌شده')}</span></div><div class="stat"><b>${done}/150</b><span>${t('Afgeronde lessen','درس‌های کامل‌شده')}</span></div><div class="stat"><b>${Math.round(done/150*100)}%</b><span>${t('Voortgang','پیشرفت')}</span></div><div class="stat"><b>30</b><span>${t('Beschikbare examens','امتحان‌های موجود')}</span></div></div><div style="margin-top:16px" class="progress-row"><span>${t('Theorievoortgang','پیشرفت تیوری')}</span><div class="progress"><i style="width:${done/1.5}%"></i></div></div><div class="hero-actions" style="margin-top:16px"><button class="primary" onclick="go('lessons')">${t('Verder met lessen','ادامه درس‌ها')}</button><button class="ghost" onclick="go('signs')">${t('Naar borden','رفتن به علایم')}</button><button class="ghost" onclick="go('exams')">${t('Naar examens','رفتن به امتحان‌ها')}</button></div></section><section class="card panel"><h3>${t('Aanbevolen leerroute','مسیر پیشنهادی یادگیری')}</h3><div class="timeline"><div class="row"><div class="dot"></div><div><b>${t('Module 1–3','ماژول ۱–۳')}</b><div>${t('Voertuig, plaats op de weg en snelheid.','وسیله نقلیه، جایگاه در جاده و سرعت.')}</div></div></div><div class="row"><div class="dot"></div><div><b>${t('Module 4–8','ماژول ۴–۸')}</b><div>${t('Voorrang, manoeuvres en tekens.','حق تقدم، مانورها و علایم.')}</div></div></div><div class="row"><div class="dot"></div><div><b>${t('Module 9–15','ماژول ۹–۱۵')}</b><div>${t('Veilig rijden, parkeren en examenvoorbereiding.','رانندگی ایمن، پارک و آمادگی امتحان.')}</div></div></div></div><div class="notice" style="margin-top:16px">${t('Compact idee: je ziet steeds één module tegelijk met 10 lessen.','طرح فشرده: هر بار فقط یک ماژول با ۱۰ درس را می‌بینید.')}</div></section></div>${footer()}</main>`}
function lessonsView(){const q=state.query.toLowerCase();let filtered=lessons.filter(l=>l.module===state.module);if(q)filtered=filtered.filter(l=>(state.lang==='fa'?l.titleFa:l.titleNl).toLowerCase().includes(q)||(state.lang==='fa'?l.catFa:l.catNl).toLowerCase().includes(q));const mod=modules.find(m=>m.id===state.module);return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('150 theorielessen','۱۵۰ درس تیوری')}</h2><p>${t('Compact per module: 10 lessen tegelijk.','فشرده بر اساس ماژول: هر بار ۱۰ درس.')}</p></div><div class="small">${t('Module','ماژول')} ${state.module} / 15</div></div><div class="chips">${modules.map(m=>`<button class="chip ${state.module===m.id?'active':''}" onclick="setModule(${m.id})">${m.id}. ${t(m.nl,m.fa)}</button>`).join('')}</div><div class="module-box card" style="margin-top:12px"><div class="progress-row" style="margin-bottom:10px"><span class="pill">${t(mod.nl,mod.fa)}</span><div class="grow"></div><span>${doneCount()}/150</span></div><input class="search" placeholder="${t('Zoek in deze module…','در این ماژول جستجو کنید…')}" oninput="state.query=this.value;render()" value="${state.query}"><div class="grid" style="margin-top:14px">${filtered.map(l=>`<article class="card lesson-card"><div class="lesson-art">${art(l.id)}</div><h3>${l.id}. ${t(l.titleNl,l.titleFa)}</h3><p>${t(l.bodyNl,l.bodyFa)}</p><div class="meta"><span class="pill">${t(l.catNl,l.catFa)}</span><button class="mini" onclick="toggleLesson(${l.id})">${isDone(l.id)?'✓ '+t('Geleerd','یاد گرفتم'):t('Markeer geleerd','علامت بزن')}</button></div></article>`).join('')}</div><div class="pager"><button class="ghost" onclick="prevModule()" ${state.module===1?'disabled':''}>← ${t('Vorige module','ماژول قبلی')}</button><button class="ghost" onclick="nextModule()" ${state.module===15?'disabled':''}>${t('Volgende module','ماژول بعدی')} →</button></div></div>${footer()}</main>`}
function signsView(){return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('Verkeersborden','علایم ترافیکی')}</h2><p>${t('Meer echte borden en compacter overzicht.','علایم واقعی بیشتر و نمای فشرده‌تر.')}</p></div></div><div class="sign-grid">${signs.map(s=>`<div class="card sign-card"><div class="sign-visual">${signSvg(s[3],s[0],s[4])}</div><b>${s[0]}</b><small>${t(s[1],s[2])}</small></div>`).join('')}</div>${footer()}</main>`}
function wordsView(){return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('Verkeerswoorden NL ↔ Dari/Farsi','واژه‌های ترافیکی هالندی ↔ دری/فارسی')}</h2><p>${t('Belangrijke woorden die in lessen en examens terugkomen.','واژه‌های مهمی که در درس‌ها و امتحان‌ها تکرار می‌شوند.')}</p></div></div><div class="words">${words.map(w=>`<div class="word"><span>${w[0]}</span><span>${w[1]}</span></div>`).join('')}</div>${footer()}</main>`}
function hazardView(){const h=hazard[state.hazardIndex];const labels={rem:t('Remmen','ترمز'),gas:t('Gas loslaten','گاز را رها کن'),nothing:t('Niets doen','هیچ')};return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('Remmen / gas loslaten / niets doen','ترمز / رها کردن گاز / هیچ')}</h2><p>${t('Korte en duidelijke training.','تمرین کوتاه و روشن.')}</p></div></div><div class="hazard"><div class="card"><div class="question-art">${art(80+state.hazardIndex)}</div></div><div class="card"><span class="pill">${state.hazardIndex+1}/${hazard.length}</span><h2>${t(h.qNl,h.qFa)}</h2><div class="hazard-actions">${['rem','gas','nothing'].map(k=>`<button class="choice ${state.hazardChoice? (k===h.a?'good':state.hazardChoice===k?'bad':''):''}" onclick="hazardAnswer('${k}')">${labels[k]}</button>`).join('')}</div>${state.hazardChoice?`<p style="margin-top:16px;color:var(--muted)">${t(h.whyNl,h.whyFa)}</p><button class="primary" onclick="nextHazard()">${t('Volgende','بعدی')}</button>`:''}</div></div>${footer()}</main>`}
function examsView(){return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('30 oefenexamens','۳۰ امتحان تمرینی')}</h2><p>${t('Elk examen: 50 vragen, 30 minuten, mobiel compact.','هر امتحان: ۵۰ سوال، ۳۰ دقیقه، فشرده برای موبایل.')}</p></div></div><div class="exam-list">${Array.from({length:30},(_,i)=>`<div class="card exam-card"><span class="pill">${t('Examen','امتحان')} ${i+1}</span><h3>${t('Auto Theorie B','تیوری موتر B')}</h3><p>50 ${t('vragen','سوال')} • 30 ${t('minuten','دقیقه')}</p><button class="primary" onclick="startExam(${i+1})">${t('Start examen','شروع امتحان')}</button></div>`).join('')}</div>${footer()}</main>`}
function footer(){return `<footer class="footer">Mursaltheorie • ${t('Nederlands €34,99 • Tweetalig €64,99 per maand','هالندی €34,99 • دوزبانه €64,99 در ماه')}</footer>`}
function choosePlan(plan){state.plan=plan;localStorage.setItem('mt-plan',plan);if(plan==='nl')setLang('nl');else setLang('fa');go('dashboard')}
function go(v){state.view=v;state.query='';render();window.scrollTo(0,0)}
function setLang(l){state.lang=l;localStorage.setItem('mt-lang',l);render()}
function setModule(m){state.module=m;state.query='';render();window.scrollTo(0,0)}
function prevModule(){if(state.module>1) setModule(state.module-1)}
function nextModule(){if(state.module<15) setModule(state.module+1)}
function isDone(id){return JSON.parse(localStorage.getItem('mt-done')||'[]').includes(id)}
function doneCount(){return JSON.parse(localStorage.getItem('mt-done')||'[]').length}
function toggleLesson(id){let d=JSON.parse(localStorage.getItem('mt-done')||'[]');d=d.includes(id)?d.filter(x=>x!==id):[...d,id];localStorage.setItem('mt-done',JSON.stringify(d));render()}
function hazardAnswer(k){state.hazardChoice=k;render()}
function nextHazard(){state.hazardIndex=(state.hazardIndex+1)%hazard.length;state.hazardChoice=null;render()}
function examQuestions(num){const start=((num-1)*17)%questionPool.length;return Array.from({length:50},(_,i)=>questionPool[(start+i*7)%questionPool.length])}
function startExam(num){state.exam={num,index:0,answers:Array(50).fill(null),remaining:1800,questions:examQuestions(num),timer:null,result:null};render();state.exam.timer=setInterval(()=>{if(!state.exam)return;state.exam.remaining--;updateTimer();if(state.exam.remaining<=0)finishExam();},1000)}
function updateTimer(){const el=document.getElementById('timer');if(!el||!state.exam)return;const m=String(Math.floor(state.exam.remaining/60)).padStart(2,'0'),s=String(state.exam.remaining%60).padStart(2,'0');el.textContent=`${m}:${s}`}
function answerExam(i){state.exam.answers[state.exam.index]=i;render()}
function gotoQ(i){state.exam.index=i;render()}
function moveQ(d){state.exam.index=Math.max(0,Math.min(49,state.exam.index+d));render()}
function closeExam(){if(state.exam?.timer)clearInterval(state.exam.timer);state.exam=null;render()}
function finishExam(){if(state.exam?.timer)clearInterval(state.exam.timer);let score=0;state.exam.questions.forEach((q,i)=>{if(state.exam.answers[i]===q.correct)score++});state.exam.result={score,passed:score>=44};render()}
function examView(){const e=state.exam;if(e.result)return `<div class="exam-wrap ${state.lang==='fa'?'rtl':''}"><div class="result card"><span class="pill">${t('Examenresultaat','نتیجه امتحان')}</span><div class="score">${e.result.score}/50</div><h1>${e.result.passed?t('Geslaagd','قبول شدید'):t('Nog niet geslaagd','هنوز قبول نشدید')}</h1><p>${t('De huidige testversie gebruikt 44/50 als slaaggrens.','نسخه فعلی حد قبولی ۴۴/۵۰ را استفاده می‌کند.')}</p><button class="primary" onclick="closeExam()">${t('Terug naar examens','بازگشت به امتحان‌ها')}</button></div></div>`; const q=e.questions[e.index],ans=state.lang==='fa'?q.aFa:q.aNl; return `<div class="exam-wrap ${state.lang==='fa'?'rtl':''}"><div class="exam-top"><button class="ghost" onclick="closeExam()">✕</button><div>${e.index+1}/50</div><div class="exam-progress progress"><i style="width:${((e.index+1)/50)*100}%"></i></div><div class="timer" id="timer">${String(Math.floor(e.remaining/60)).padStart(2,'0')}:${String(e.remaining%60).padStart(2,'0')}</div></div><div class="exam-main"><section class="question-card"><div class="question-art">${art(q.seed+e.num)}</div><h2>${t(q.qNl,q.qFa)}</h2><div class="answers">${ans.map((a,i)=>`<button class="answer ${e.answers[e.index]===i?'selected':''}" onclick="answerExam(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div class="exam-bottom"><button class="ghost" onclick="moveQ(-1)" ${e.index===0?'disabled':''}>← ${t('Vorige','قبلی')}</button>${e.index===49?`<button class="primary" onclick="finishExam()">${t('Inleveren','تحویل')}</button>`:`<button class="primary" onclick="moveQ(1)">${t('Volgende','بعدی')} →</button>`}</div></section><aside class="side-nav"><h3>${t('Vragen','سوال‌ها')}</h3><div class="qgrid">${Array.from({length:50},(_,i)=>`<button class="${i===e.index?'current':''} ${e.answers[i]!=null?'done':''}" onclick="gotoQ(${i})">${i+1}</button>`).join('')}</div><button class="primary" style="width:100%;margin-top:14px" onclick="finishExam()">${t('Examen inleveren','تحویل امتحان')}</button></aside></div></div>`}
function render(){document.documentElement.lang=state.lang==='fa'?'fa':'nl';document.documentElement.dir=state.lang==='fa'?'rtl':'ltr';document.getElementById('app').innerHTML=state.exam?examView():nav()+({home, dashboard, lessons:lessonsView, signs:signsView, words:wordsView, hazard:hazardView, exams:examsView}[state.view]());}
render();
</script></body></html>
