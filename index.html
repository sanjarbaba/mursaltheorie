function signSvg(type,code){
 const common='viewBox="0 0 100 100" width="90" height="90" xmlns="http://www.w3.org/2000/svg"';
 if(type==='yield')return `<svg ${common}><path d="M50 86 L10 17 H90 Z" fill="#fff" stroke="#d53434" stroke-width="9"/></svg>`;
 if(type==='stop')return `<svg ${common}><polygon points="31,7 69,7 93,31 93,69 69,93 31,93 7,69 7,31" fill="#d22e2e" stroke="#fff" stroke-width="3"/><text x="50" y="59" font-size="24" text-anchor="middle" fill="#fff" font-weight="900">STOP</text></svg>`;
 if(type==='diamond')return `<svg ${common}><rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)" fill="#ffd43b" stroke="#fff" stroke-width="8"/><rect x="17" y="17" width="66" height="66" transform="rotate(45 50 50)" fill="none" stroke="#111" stroke-width="3"/></svg>`;
 if(['speed','endspeed','advice'].includes(type))return `<svg ${common}><circle cx="50" cy="50" r="38" fill="#fff" stroke="${type==='advice'?'#333':'#d22e2e'}" stroke-width="8" ${type==='advice'?'stroke-dasharray="4 4"':''}/><text x="50" y="61" font-size="30" text-anchor="middle" font-weight="900">50</text>${type==='endspeed'?'<path d="M22 78 L78 22" stroke="#333" stroke-width="5"/>':''}</svg>`;
 if(type==='noentry')return `<svg ${common}><circle cx="50" cy="50" r="40" fill="#d22e2e"/><rect x="20" y="43" width="60" height="14" rx="3" fill="#fff"/></svg>`;
 if(['nopark','nostop'].includes(type))return `<svg ${common}><circle cx="50" cy="50" r="39" fill="#2868b2" stroke="#d22e2e" stroke-width="8"/><path d="M22 22 L78 78${type==='nostop'?' M78 22 L22 78':''}" stroke="#d22e2e" stroke-width="8"/></svg>`;
 if(['parking','blue','motorway','autoweg','oneway','roundabout'].includes(type))return `<svg ${common}><rect x="10" y="10" width="80" height="80" rx="7" fill="#2775bd"/><text x="50" y="61" font-size="${type==='parking'?42:24}" text-anchor="middle" fill="#fff" font-weight="900">${type==='parking'?'P':code}</text></svg>`;
 if(type==='warning')return `<svg ${common}><path d="M50 10 L93 88 H7 Z" fill="#fff" stroke="#d22e2e" stroke-width="8"/><text x="50" y="68" font-size="28" text-anchor="middle" font-weight="900">!</text></svg>`;
 return `<svg ${common}><circle cx="50" cy="50" r="39" fill="#fff" stroke="#d22e2e" stroke-width="8"/><text x="50" y="59" font-size="18" text-anchor="middle" font-weight="900">${code}</text></svg>`;
}

function signsView(){return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('Verkeersborden','علایم ترافیکی')}</h2><p>${t('Voor de testversie staat hier een kernset; de structuur is klaar om de volledige RVV-bordenlijst te vullen.','در نسخه آزمایشی مجموعه اصلی قرار دارد؛ ساختار برای تمام علایم RVV آماده است.')}</p></div></div><div class="sign-grid">${signs.map(s=>`<div class="card sign-card"><div class="sign-visual">${signSvg(s[3],s[0])}</div><b>${s[0]}</b><small>${t(s[1],s[2])}</small></div>`).join('')}</div>${footer()}</main>`}
function wordsView(){return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('Verkeerswoorden NL ↔ Dari/Farsi','واژه‌های ترافیکی هالندی ↔ دری/فارسی')}</h2><p>${t('Belangrijke woorden die in lessen en examens terugkomen.','واژه‌های مهمی که در درس‌ها و امتحان‌ها تکرار می‌شوند.')}</p></div></div><div class="words">${words.map(w=>`<div class="word"><span>${w[0]}</span><span>${w[1]}</span></div>`).join('')}</div>${footer()}</main>`}
function hazardView(){const h=hazard[state.hazardIndex];const labels={rem:t('Remmen','ترمز'),gas:t('Gas loslaten','گاز را رها کن'),nothing:t('Niets doen','هیچ')};return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('Remmen / gas loslaten / niets doen','ترمز / رها کردن گاز / هیچ')}</h2><p>${t('Train risico-inschatting als vaardigheid. Dit is een oefenmodule, niet een apart CBR-examenblok.','تشخیص خطر را تمرین کنید. این بخش تمرینی است و بخش جداگانه امتحان CBR نیست.')}</p></div></div><div class="hazard"><div class="card"><div class="question-art">${art(80+state.hazardIndex)}</div></div><div class="card"><span class="pill">${state.hazardIndex+1}/${hazard.length}</span><h2>${t(h.qNl,h.qFa)}</h2><div class="hazard-actions">${['rem','gas','nothing'].map(k=>`<button class="choice ${state.hazardChoice? (k===h.a?'good':state.hazardChoice===k?'bad':''):''}" onclick="hazardAnswer('${k}')">${labels[k]}</button>`).join('')}</div>${state.hazardChoice?`<p style="margin-top:16px;color:var(--muted)">${t(h.whyNl,h.whyFa)}</p><button class="primary" onclick="nextHazard()">${t('Volgende','بعدی')}</button>`:''}</div></div>${footer()}</main>`}
function examsView(){return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('30 oefenexamens','۳۰ امتحان تمرینی')}</h2><p>${t('Elk examen: 50 vragen, 30 minuten, slaaggrens 44/50. Vragen zijn origineel voor deze testomgeving.','هر امتحان: ۵۰ سوال، ۳۰ دقیقه، حد قبولی ۴۴/۵۰. سوال‌ها برای این محیط آزمایشی نوشته شده‌اند.')}</p></div></div><div class="exam-list">${Array.from({length:30},(_,i)=>`<div class="card exam-card"><span class="pill">${t('Examen','امتحان')} ${i+1}</span><h3>${t('Auto Theorie B','تیوری موتر B')}</h3><p>50 ${t('vragen','سوال')} • 30 ${t('minuten','دقیقه')}</p><button class="primary" onclick="startExam(${i+1})">${t('Start examen','شروع امتحان')}</button></div>`).join('')}</div>${footer()}</main>`}
function footer(){return `<footer class="footer">Mursaltheorie • ${t('Nederlands €34,99 • Tweetalig €64,99 per maand','هالندی €34,99 • دوزبانه €64,99 در ماه')}</footer>`}
function choosePlan(plan){localStorage.setItem('mt-plan',plan);if(plan==='nl')setLang('nl');else {state.lang='fa';localStorage.setItem('mt-lang','fa');render();}go('lessons')}
function go(v){state.view=v;state.query='';render();window.scrollTo(0,0)} function setLang(l){state.lang=l;localStorage.setItem('mt-lang',l);render()} function isDone(id){return JSON.parse(localStorage.getItem('mt-done')||'[]').includes(id)} function doneCount(){return JSON.parse(localStorage.getItem('mt-done')||'[]').length} function toggleLesson(id){let d=JSON.parse(localStorage.getItem('mt-done')||'[]');d=d.includes(id)?d.filter(x=>x!==id):[...d,id];localStorage.setItem('mt-done',JSON.stringify(d));render()} function hazardAnswer(k){state.hazardChoice=k;render()} function nextHazard(){state.hazardIndex=(state.hazardIndex+1)%hazard.length;state.hazardChoice=null;render()}
function examQuestions(num){const start=((num-1)*17)%questionPool.length;return Array.from({length:50},(_,i)=>questionPool[(start+i*7)%questionPool.length])}
function startExam(num){state.exam={num,index:0,answers:Array(50).fill(null),marked:Array(50).fill(false),remaining:1800,questions:examQuestions(num),timer:null,result:null};render();state.exam.timer=setInterval(()=>{if(!state.exam)return;state.exam.remaining--;updateTimer();if(state.exam.remaining<=0)finishExam();},1000)}
function updateTimer(){const el=document.getElementById('timer');if(!el||!state.exam)return;const m=String(Math.floor(state.exam.remaining/60)).padStart(2,'0'),s=String(state.exam.remaining%60).padStart(2,'0');el.textContent=`${m}:${s}`}
function answerExam(i){state.exam.answers[state.exam.index]=i;render()} function gotoQ(i){state.exam.index=i;render()} function moveQ(d){state.exam.index=Math.max(0,Math.min(49,state.exam.index+d));render()} function closeExam(){if(state.exam?.timer)clearInterval(state.exam.timer);state.exam=null;render()} function finishExam(){if(state.exam?.timer)clearInterval(state.exam.timer);let score=0;state.exam.questions.forEach((q,i)=>{if(state.exam.answers[i]===q.correct)score++});state.exam.result={score,passed:score>=44};render()}
function examView(){const e=state.exam;if(e.result)return `<div class="exam-wrap ${state.lang==='fa'?'rtl':''}"><div class="result card"><span class="pill">${t('Examenresultaat','نتیجه امتحان')}</span><div class="score">${e.result.score}/50</div><h1>${e.result.passed?t('Geslaagd','قبول شدید'):t('Nog niet geslaagd','هنوز قبول نشدید')}</h1><p>${t('De testversie gebruikt 44/50 als slaaggrens. Bekijk je fouten later per onderwerp wanneer we de volledige feedbackmodule toevoegen.','نسخه آزمایشی حد قبولی ۴۴/۵۰ دارد. در نسخه بعدی اشتباه‌ها را بر اساس موضوع نشان می‌دهیم.')}</p><button class="primary" onclick="closeExam()">${t('Terug naar examens','بازگشت به امتحان‌ها')}</button></div></div>`;const q=e.questions[e.index],ans=state.lang==='fa'?q.aFa:q.aNl;return `<div class="exam-wrap ${state.lang==='fa'?'rtl':''}"><div class="exam-top"><button class="ghost" onclick="closeExam()">✕</button><div class="qmini">${e.index+1}/50</div><div class="exam-progress progress"><i style="width:${((e.index+1)/50)*100}%"></i></div><div class="timer" id="timer">${String(Math.floor(e.remaining/60)).padStart(2,'0')}:${String(e.remaining%60).padStart(2,'0')}</div></div><div class="exam-main"><section class="question-card"><div class="question-art">${art(q.seed+e.num)}</div><h2>${t(q.qNl,q.qFa)}</h2><div class="answers">${ans.map((a,i)=>`<button class="answer ${e.answers[e.index]===i?'selected':''}" onclick="answerExam(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div class="exam-bottom"><button class="ghost" onclick="moveQ(-1)" ${e.index===0?'disabled':''}>← ${t('Vorige','قبلی')}</button>${e.index===49?`<button class="primary" onclick="finishExam()">${t('Inleveren','تحویل')}</button>`:`<button class="primary" onclick="moveQ(1)">${t('Volgende','بعدی')} →</button>`}</div></section><aside class="side-nav"><h3>${t('Vragen','سوال‌ها')}</h3><div class="qgrid">${Array.from({length:50},(_,i)=>`<button class="${i===e.index?'current':''} ${e.answers[i]!=null?'done':''}" onclick="gotoQ(${i})">${i+1}</button>`).join('')}</div><button class="primary" style="width:100%;margin-top:14px" onclick="finishExam()">${t('Examen inleveren','تحویل امتحان')}</button></aside></div></div>`}
function render(){document.documentElement.lang=state.lang==='fa'?'fa':'nl';document.documentElement.dir=state.lang==='fa'?'rtl':'ltr';document.getElementById('app').innerHTML=state.exam?examView():nav()+({home,lessons:lessonsView,signs:signsView,words:wordsView,hazard:hazardView,exams:examsView}[state.view]());}
render();
</script>
</body>
</html>
