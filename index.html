n><b>${S.wp+1}/${max}</b><button class=ghost onclick="S.wp=Math.min(${max-1},S.wp+1);render()">→</button></div></main>`}const H=[['Een kind staat vlak bij de rijbaan.','rem'],['Je ziet ver vooruit een rood verkeerslicht.','gas'],['De weg is vrij en er is geen direct gevaar.','nothing'],['Een auto remt plots voor je.','rem'],['Je nadert rustig een rotonde met verkeer.','gas'],['Een fietser wijkt onverwacht uit.','rem']];function hazardView(){let i=+(localStorage.getItem('hi')||0)%H.length,h=H[i];return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class=head><h2>${t('Remmen / gas los / niets','ترمز / رها کردن گاز / هیچ')}</h2></div><div class="card pad"><div class=pic style="height:260px"><img src="images/${encodeURIComponent(img(h[0],i))}"></div><h2>${h[0]}</h2><div class=acts>${[['rem','Remmen','ترمز'],['gas','Gas los','رها کردن گاز'],['nothing','Niets','هیچ']].map(x=>`<button class=primary onclick="haz('${x[0]}','${h[1]}')">${t(x[1],x[2])}</button>`).join('')}</div><div id=hm></div></div></main>`}function haz(a,c){hm.innerHTML=`<div class=notice>${a===c?t('Goed.','درست است.'):t('Niet juist.','درست نیست.')}</div>`;if(a===c){localStorage.setItem('hi',(+(localStorage.getItem('hi')||0)+1)%H.length);setTimeout(render,500)}}function examsView(){let st=S.ep*6;return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class=head><h2>${t('30 oefenexamens','۳۰ امتحان تمرینی')}</h2></div><div class=examgrid>${Array.from({length:6},(_,j)=>`<div class="card examcard"><span class=pill>${t('Examen','امتحان')} ${st+j+1}</span><h3>50 ${t('vragen','سوال')}</h3><p class=mut>30 ${t('minuten','دقیقه')}</p><button class=primary onclick="startExam(${st+j+1})">${t('Start','شروع')}</button></div>`).join('')}</div><div class=pager><button class=ghost onclick="S.ep=Math.max(0,S.ep-1);render()">←</button><b>${S.ep+1}/5</b><button class=ghost onclick="S.ep=Math.min(4,S.ep+1);render()">→</button></div></main>`}function startExam(n){S.exam={n,i:0,a:Array(50).fill(null),r:1800};render();S.exam.timer=setInterval(()=>{if(!S.exam)return;S.exam.r--;if(S.exam.r<=0)finish();else{let el=document.getElementById('timer');if(el)el.textContent=time(S.exam.r)}},1000)}function time(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function eq(i,n){let b=QP[(i+n)%QP.length];return{q:b[0],a:b[1],c:b[2],im:img(b[0],i+n)}}function examView(){let e=S.exam,q=eq(e.i,e.n);return`<div class="exam ${S.lang==='fa'?'rtl':''}"><div class=examtop><button class=ghost onclick=closeExam()>✕</button><b>${e.i+1}/50</b><div class=bar><i style="width:${(e.i+1)*2}%"></i></div><b id=timer>${time(e.r)}</b></div><main class=examc><section class="card question"><div class=pic><img src="images/${encodeURIComponent(q.im)}"></div><h2>${q.q}</h2>${q.a.map((a,i)=>`<button class="ans ${e.a[e.i]===i?'good':''}" onclick="S.exam.a[S.exam.i]=${i};render()">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div class=pager><button class=ghost onclick="S.exam.i=Math.max(0,S.exam.i-1);render()" ${e.i===0?'disabled':''}>←</button>${e.i===49?`<button class=primary onclick=finish()>${t('Inleveren','تحویل')}</button>`:`<button class=primary onclick="S.exam.i++;render()">${t('Volgende','بعدی')} →</button>`}</div></section></main></div>`}function finish(){clearInterval(S.exam.timer);let sc=0;for(let i=0;i<50;i++)if(S.exam.a[i]===eq(i,S.exam.n).c)sc++;alert(t(`Score: ${sc}/50`,`امتیاز: ${sc}/50`));S.exam=null;render()}function closeExam(){if(S.exam?.timer)clearInterval(S.exam.timer);S.exam=null;render()}function profile(){if(!S.user){openAuth('login');return''}return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="card pad"><h2>👤 ${S.user.name}</h2><p class=mut>${S.user.email}</p><div class=stats style="padding:0"><div class=stat><b>${done()}</b><span>${t('lessen klaar','درس کامل')}</span></div><div class=stat><b>${Math.round(done()/1.5)}%</b><span>${t('voortgang','پیشرفت')}</span></div></div><div class=acts><button class=primary onclick="go('dashboard')">Dashboard</button><button class=ghost onclick=logout()>${t('Uitloggen','خروج')}</button></div></div></main>`}function authView(){if(!S.auth)return'';let r=S.am==='register';return`<div class="auth ${S.lang==='fa'?'rtl':''}"><div class=authcard><div class=brand>Mursaltheorie</div><p class=mut>${t('Log in of maak een account.','وارد شوید یا حساب بسازید.')}</p><div class=tabs><button class="${!r?'on':''}" onclick="S.am='login';render()">${t('Inloggen','ورود')}</button><button class="${r?'on':''}" onclick="S.am='register';render()">${t('Account maken','ساخت حساب')}</button></div>${r?`<div class=field><label>${t('Naam','نام')}</label><input id=name></div>`:''}<div class=field><label>E-mail</label><input id=email type=email></div><div class=field><label>${t('Wachtwoord','رمز')}</label><input id=pass type=password></div><button class="primary full" onclick=submitAuth()>${r?t('Account maken','ساخت حساب'):t('Inloggen','ورود')}</button><button class="ghost full" style="margin-top:7px" onclick="S.auth=false;render()">${t('Terug','بازگشت')}</button><p class=mut style="font-size:11px">${t('Testversie: accountgegevens worden voorlopig alleen op dit apparaat opgeslagen.','نسخه آزمایشی: اطلاعات حساب فعلاً فقط در همین دستگاه ذخیره می‌شود.')}</p></div></div>`}function submitAuth(){let e=email.value.trim(),p=pass.value,n=document.getElementById('name')?.value.trim()||e.split('@')[0];if(!e.includes('@')||p.length<4){alert(t('Controleer e-mail en wachtwoord.','ایمیل و رمز را بررسی کنید.'));return}S.user={email:e,name:n};localStorage.setItem('mt-user',JSON.stringify(S.user));S.auth=false;S.view='dashboard';render()}function openAuth(m){S.am=m;S.auth=true;render()}function logout(){localStorage.removeItem('mt-user');S.user=null;go('home')}function go(v){S.view=v;render();scrollTo(0,0)}function lang(l){S.lang=l;localStorage.setItem('mt-lang',l);render()}function setMod(m){if(m<1||m>15)return;S.mod=m;render();scrollTo(0,0)}function done(){return JSON.parse(localStorage.getItem('mt-done')||'[]').length}function isDone(id){return JSON.parse(localStorage.getItem('mt-done')||'[]').includes(id)}function toggle(id){let a=JSON.parse(localStorage.getItem('mt-done')||'[]');a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('mt-done',JSON.stringify(a));render()}function render(){document.documentElement.dir=S.lang==='fa'?'rtl':'ltr';app.innerHTML=S.exam?examView():nav()+({home,dashboard,lessons:lessonsView,signs:signsView,words:wordsView,hazard:hazardView,exams:examsView,profile}[S.view]||home)()+mobile()+lessonModal()+authView()}render();</script></body></html>
