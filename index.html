function signSvg(kind,code){const common=`<text x="50" y="56" text-anchor="middle" font-size="18" font-weight="900" fill="#222">${code}</text>`; if(kind==='diamond')return `<svg viewBox="0 0 100 100"><g transform="translate(50 50) rotate(45) translate(-50 -50)"><rect x="18" y="18" width="64" height="64" fill="#fff" stroke="#111" stroke-width="4"/><rect x="30" y="30" width="40" height="40" fill="#ffd941" stroke="#111" stroke-width="4"/></g></svg>`; if(kind==='triangle')return `<svg viewBox="0 0 100 100"><polygon points="50,12 88,84 12,84" fill="#fff" stroke="#d11" stroke-width="8"/><polygon points="50,28 74,74 26,74" fill="#fff"/></svg>`; if(kind==='stop')return `<svg viewBox="0 0 100 100"><polygon points="30,8 70,8 92,30 92,70 70,92 30,92 8,70 8,30" fill="#c81818" stroke="#fff" stroke-width="5"/><text x="50" y="57" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">STOP</text></svg>`; if(kind==='mand-right')return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#1d5fd3"/><path d="M28 50h27V35l18 15-18 15V50H28z" fill="#fff"/></svg>`; if(kind==='mand-left')return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#1d5fd3"/><path d="M72 50H45V35L27 50l18 15V50h27z" fill="#fff"/></svg>`; if(kind==='closed')return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fff" stroke="#d11" stroke-width="10"/></svg>`; if(kind==='oneway')return `<svg viewBox="0 0 100 100"><rect x="16" y="28" width="68" height="44" rx="10" fill="#1d5fd3"/><path d="M28 50h30V38l16 12-16 12V50H28z" fill="#fff"/></svg>`; if(kind==='speed')return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fff" stroke="#d11" stroke-width="8"/>${common}</svg>`; if(kind==='warn')return `<svg viewBox="0 0 100 100"><polygon points="50,10 90,86 10,86" fill="#fff" stroke="#d11" stroke-width="8"/><path d="M50 32v28" stroke="#111" stroke-width="8" stroke-linecap="round"/><circle cx="50" cy="72" r="4" fill="#111"/></svg>`; if(kind==='cross')return `<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="8" fill="#1d5fd3"/><path d="M26 62h48l-24-28z" fill="#fff"/><path d="M50 36l-8 10 8 18 8-18z" fill="#1d5fd3"/></svg>`; if(kind==='motorway')return `<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="8" fill="#1d5fd3"/><path d="M38 26v48M62 26v48M44 26L34 74M56 26l10 48" stroke="#fff" stroke-width="6"/></svg>`; return `<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="8" fill="#1d5fd3"/><path d="M30 70V36h40v34" fill="none" stroke="#fff" stroke-width="8"/><circle cx="50" cy="50" r="6" fill="#fff"/></svg>`;}
function home(){return `<main class="shell ${state.lang==='fa'?'rtl':''}"><section class="hero"><div class="hero-card hero-copy"><span class="eyebrow">${t('Auto Theorie B • Mursaltheorie','تیوری موتر B • مرسل تیوری')}</span><h1>${t('Leer slim, mobiel en duidelijk voor je theorie-examen.','برای امتحان تیوری، هوشمندانه، موبایلی و واضح یاد بگیرید.')}</h1><p>${t('Mursaltheorie is gebouwd voor cursisten die duidelijke lessen, goede afbeeldingen en een examenweergave zonder onnodig scrollen willen. Kies tussen de Nederlandse versie of de uitgebreide tweetalige versie in Nederlands + Dari/Farsi.','مرسل تیوری برای کسانی ساخته شده که درس‌های واضح، تصویرهای خوب و صفحه امتحان بدون اسکرول اضافی می‌خواهند. می‌توانید بین نسخه هالندی یا نسخه دوزبانه هالندی + دری/فارسی انتخاب کنید.')}</p><div class="hero-actions"><button class="primary" onclick="go('dashboard')">${t('Open dashboard','باز کردن داشبورد')}</button><button class="ghost" onclick="go('lessons')">${t('Bekijk lessen','دیدن درس‌ها')}</button></div><div class="pricing"><div class="card price-card"><h3>${t('Mursaltheorie Nederlands','مرسل تیوری هالندی')}</h3><div class="price-tag">€34,99 <small>${t('per maand','در ماه')}</small></div><ul class="feature-list"><li>${t('Volledige NL-lessen','درس‌های کامل هالندی')}</li><li>${t('150 theorielessen','۱۵۰ درس تیوری')}</li><li>${t('30 oefenexamens','۳۰ امتحان تمرینی')}</li><li>${t('Mobiele examenweergave','نمایش موبایلی امتحان')}</li></ul><button class="primary" onclick="choosePlan('nl')">${t('Kies NL versie','انتخاب نسخه هالندی')}</button></div><div class="card price-card featured"><div class="plan-badge">${t('Aanbevolen','پیشنهادی')}</div><h3>${t('Mursaltheorie Tweetalig','مرسل تیوری دوزبانه')}</h3><div class="price-tag">€64,99 <small>${t('per maand','در ماه')}</small></div><ul class="feature-list"><li>${t('Alles uit NL-versie','همه چیز نسخه هالندی')}</li><li>${t('Dari/Farsi vertalingen','ترجمه دری/فارسی')}</li><li>${t('Verkeerswoorden NL ↔ Dari/Farsi','واژه‌های ترافیکی هالندی ↔ دری/فارسی')}</li><li>${t('Extra taalondersteuning in lessen','کمک زبانی اضافه در درس‌ها')}</li></ul><button class="primary" onclick="choosePlan('fa')">${t('Kies tweetalig','انتخاب دوزبانه')}</button></div></div></div><div class="hero-card stats"><div class="stat"><b>150+</b><span>${t('Theorielessen','درس تیوری')}</span></div><div class="stat"><b>30</b><span>${t('Oefenexamens','امتحان تمرینی')}</span></div><div class="stat"><b>50</b><span>${t('Vragen per examen','سوال در هر امتحان')}</span></div><div class="stat"><b>44/50</b><span>${t('Slaaggrens','حد قبولی')}</span></div></div></section><section><div class="section-title"><div><h2>${t('Alles op één plek','همه چیز در یک جا')}</h2><p>${t('Ontworpen voor duidelijk leren op telefoon én computer.','برای یادگیری واضح در موبایل و کمپیوتر طراحی شده است.')}</p></div></div><div class="grid">${[['Dashboard','داشبورد','Zie voortgang, gekozen plan en snelle ingangen naar lessen en examens.','پیشرفت، پلان انتخاب‌شده و راه‌های سریع به درس‌ها و امتحان‌ها را ببینید.','dashboard'],['Verkeersborden','علایم ترافیکی','Leer borden per code, betekenis en categorie.','علایم را با کد، معنی و دسته‌بندی یاد بگیرید.','signs'],['Gevaartraining','تمرین خطر','Train remmen, gas loslaten of niets doen.','ترمز، رها کردن گاز یا هیچ را تمرین کنید.','hazard']].map((x,i)=>`<div class="card lesson-card"><div class="lesson-art">${art(i+2)}</div><h3>${t(x[0],x[1])}</h3><p>${t(x[2],x[3])}</p><div class="meta"><button class="mini" onclick="go('${x[4]}')">${t('Open','باز کن')}</button></div></div>`).join('')}</div></section>${footer()}</main>`;}
function dashboard(){const done=doneCount(); return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('Jouw dashboard','داشبورد شما')}</h2><p>${t('Ga snel verder met lessen, borden, woorden en examens.','به سرعت با درس‌ها، علایم، واژه‌ها و امتحان‌ها ادامه دهید.')}</p></div></div><div class="dash-grid"><section class="card panel"><div class="mini-grid"><div class="stat"><b>${state.plan==='fa'?'NL + FA':'NL'}</b><span>${t('Gekozen pakket','پلان انتخاب‌شده')}</span></div><div class="stat"><b>${done}/150</b><span>${t('Afgeronde lessen','درس‌های کامل‌شده')}</span></div><div class="stat"><b>${Math.round(done/150*100)}%</b><span>${t('Voortgang','پیشرفت')}</span></div><div class="stat"><b>30</b><span>${t('Beschikbare examens','امتحان‌های موجود')}</span></div></div><div style="margin-top:18px" class="progress-row"><span>${t('Theorievoortgang','پیشرفت تیوری')}</span><div class="progress"><i style="width:${done/1.5}%"></i></div></div><div class="notice" style="margin-top:16px">${t('Tip: werk eerst 10 lessen af, leer daarna de borden en maak dan Examen 1.', 'نکته: اول ۱۰ درس را تمام کنید، بعد علایم را یاد بگیرید و سپس امتحان ۱ را انجام دهید.')}</div><div class="hero-actions" style="margin-top:18px"><button class="primary" onclick="go('lessons')">${t('Verder met lessen','ادامه درس‌ها')}</button><button class="ghost" onclick="go('exams')">${t('Naar examens','رفتن به امتحان‌ها')}</button></div></section><section class="card panel"><h3>${t('Aanbevolen leerroute','مسیر پیشنهادی یادگیری')}</h3><div class="timeline"><div class="row"><div class="dot"></div><div><b>${t('Stap 1','گام ۱')}</b><div>${t('Basislessen voertuig, plaats op de weg en snelheid.','درس‌های پایه: وسیله نقلیه، جایگاه در جاده و سرعت.')}</div></div></div><div class="row"><div class="dot"></div><div><b>${t('Stap 2','گام ۲')}</b><div>${t('Voorrang, kruispunten en manoeuvres.','حق تقدم، تقاطع‌ها و مانورها.')}</div></div></div><div class="row"><div class="dot"></div><div><b>${t('Stap 3','گام ۳')}</b><div>${t('Verkeersborden en verkeerswoorden herhalen.','مرور علایم و واژه‌های ترافیکی.')}</div></div></div><div class="row"><div class="dot"></div><div><b>${t('Stap 4','گام ۴')}</b><div>${t('Gevaartraining en daarna oefenexamens.','تمرین خطر و سپس امتحان‌های تمرینی.')}</div></div></div></div></section></div>${footer()}</main>`;}
function lessonsView(){const q=state.query.toLowerCase();const filtered=lessons.filter(l=>(state.lang==='fa'?l.titleFa:l.titleNl).toLowerCase().includes(q)||(state.lang==='fa'?l.catFa:l.catNl).toLowerCase().includes(q));return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('150 theorielessen','۱۵۰ درس تیوری')}</h2><p>${t('15 thema’s × 10 lessen. Voortgang wordt lokaal op dit apparaat opgeslagen.','۱۵ موضوع × ۱۰ درس. پیشرفت در همین دستگاه ذخیره می‌شود.')}</p></div></div><input class="search" placeholder="${t('Zoek les of thema…','جستجوی درس یا موضوع…')}" oninput="state.query=this.value;render()" value="${state.query}"><div class="progress-row" style="margin:14px 0"><span>${doneCount()}/150</span><div class="progress"><i style="width:${doneCount()/1.5}%"></i></div></div><div class="grid">${filtered.map(l=>`<article class="card lesson-card"><div class="lesson-art">${art(l.id)}</div><h3>${l.id}. ${t(l.titleNl,l.titleFa)}</h3><p>${t(l.bodyNl,l.bodyFa)}</p><div class="meta"><span class="pill">${t(l.catNl,l.catFa)}</span><button class="mini" onclick="toggleLesson(${l.id})">${isDone(l.id)?'✓ '+t('Geleerd','یاد گرفتم'):t('Markeer geleerd','علامت بزن')}</button></div></article>`).join('')}</div>${footer()}</main>`;}
function signsView(){return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('Verkeersborden','علایم ترافیکی')}</h2><p>${t('Een kernset met veelvoorkomende borden. Later vullen we dit uit tot de volledige bordenbibliotheek.','یک مجموعه اصلی از علایم پرکاربرد. بعداً آن را تا کتابخانه کامل علایم توسعه می‌دهیم.')}</p></div></div><div class="sign-grid">${signs.map(s=>`<div class="card sign-card"><div class="sign-visual">${signSvg(s[3],s[0])}</div><b>${s[0]}</b><small>${t(s[1],s[2])}</small></div>`).join('')}</div>${footer()}</main>`;}
function wordsView(){return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('Verkeerswoorden NL ↔ Dari/Farsi','واژه‌های ترافیکی هالندی ↔ دری/فارسی')}</h2><p>${t('Belangrijke woorden die in lessen en examens terugkomen.','واژه‌های مهمی که در درس‌ها و امتحان‌ها تکرار می‌شوند.')}</p></div></div><div class="words">${words.map(w=>`<div class="word"><span>${w[0]}</span><span>${w[1]}</span></div>`).join('')}</div>${footer()}</main>`;}
function hazardView(){const h=hazard[state.hazardIndex];const labels={rem:t('Remmen','ترمز'),gas:t('Gas loslaten','گاز را رها کن'),nothing:t('Niets doen','هیچ')};return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('Remmen / gas loslaten / niets doen','ترمز / رها کردن گاز / هیچ')}</h2><p>${t('Train risico-inschatting als vaardigheid. Dit is een oefenmodule, niet een apart CBR-examenblok.','تشخیص خطر را به عنوان مهارت تمرین کنید. این بخش تمرینی است و بلاک جداگانه امتحان CBR نیست.')}</p></div></div><div class="hazard"><div class="card"><div class="question-art">${art(80+state.hazardIndex)}</div></div><div class="card"><span class="pill">${state.hazardIndex+1}/${hazard.length}</span><h2>${t(h.qNl,h.qFa)}</h2><div class="hazard-actions">${['rem','gas','nothing'].map(k=>`<button class="choice ${state.hazardChoice? (k===h.a?'good':state.hazardChoice===k?'bad':''):''}" onclick="hazardAnswer('${k}')">${labels[k]}</button>`).join('')}</div>${state.hazardChoice?`<p style="margin-top:16px;color:var(--muted)">${t(h.whyNl,h.whyFa)}</p><button class="primary" onclick="nextHazard()">${t('Volgende','بعدی')}</button>`:''}</div></div>${footer()}</main>`;}
function examsView(){return `<main class="shell ${state.lang==='fa'?'rtl':''}"><div class="section-title"><div><h2>${t('30 oefenexamens','۳۰ امتحان تمرینی')}</h2><p>${t('Elk examen: 50 vragen, 30 minuten, slaaggrens 44/50.','هر امتحان: ۵۰ سوال، ۳۰ دقیقه، حد قبولی ۴۴/۵۰.')}</p></div></div><div class="exam-list">${Array.from({length:30},(_,i)=>`<div class="card exam-card"><span class="pill">${t('Examen','امتحان')} ${i+1}</span><h3>${t('Auto Theorie B','تیوری موتر B')}</h3><p>50 ${t('vragen','سوال')} • 30 ${t('minuten','دقیقه')}</p><button class="primary" onclick="startExam(${i+1})">${t('Start examen','شروع امتحان')}</button></div>`).join('')}</div>${footer()}</main>`;}
function footer(){return `<footer class="footer">Mursaltheorie • ${t('Nederlands €34,99 • Tweetalig €64,99 per maand','هالندی €34,99 • دوزبانه €64,99 در ماه')}</footer>`}
function choosePlan(plan){state.plan=plan;localStorage.setItem('mt-plan',plan);if(plan==='nl')setLang('nl');else setLang('fa');go('dashboard')}
function go(v){state.view=v;state.query='';render();window.scrollTo(0,0)}
function setLang(l){state.lang=l;localStorage.setItem('mt-lang',l);render()}
function isDone(id){return JSON.parse(localStorage.getItem('mt-done')||'[]').includes(id)}
function doneCount(){return JSON.parse(localStorage.getItem('mt-done')||'[]').length}
function toggleLesson(id){let d=JSON.parse(localStorage.getItem('mt-done')||'[]');d=d.includes(id)?d.filter(x=>x!==id):[...d,id];localStorage.setItem('mt-done',JSON.stringify(d));render()}
function hazardAnswer(k){state.hazardChoice=k;render()}
function nextHazard(){state.hazardIndex=(state.hazardIndex+1)%hazard.length;state.hazardChoice=null;render()}
function examQuestions(num){const start=((num-1)*17)%questionPool.length;return Array.from({length:50},(_,i)=>questionPool[(start+i*7)%questionPool.length])}
function startExam(num){state.exam={num,index:0,answers:Array(50).fill(null),remaining:1800,questions:examQuestions(num),timer:null,result:null};render();state.exam.timer=setInterval(()=>{if(!state.exam)return;state.exam.remaining--;updateTimer();if(state.exam.remaining<=0)finishExam();},1000)}
function updateTimer(){const el=document.getElementById('timer');if(!el||!state.exam)return;const m=String(Math.floor(state.exam.remaining/60)).padStart(2,'0'),s=String(state.exam.remaining%60).padStart(2,'0');el.textContent=`${m}:${s}`}
function answerExam(i){state.exam.answers[state.exam.index]=i;render()}
function gotoQ(i){state.exam.index=i;render()}
function moveQ(d){state.exam.index=Math.max(0,Math.min(49,state.exam.index+d));render()}
function closeExam(){if(state.exam?.timer)clearInterval(state.exam.timer);state.exam=null;render()}
function finishExam(){if(state.exam?.timer)clearInterval(state.exam.timer);let score=0;state.exam.questions.forEach((q,i)=>{if(state.exam.answers[i]===q.correct)score++});state.exam.result={score,passed:score>=44};render()}
function examView(){const e=state.exam;if(e.result)return `<div class="exam-wrap ${state.lang==='fa'?'rtl':''}"><div class="result card"><span class="pill">${t('Examenresultaat','نتیجه امتحان')}</span><div class="score">${e.result.score}/50</div><h1>${e.result.passed?t('Geslaagd','قبول شدید'):t('Nog niet geslaagd','هنوز قبول نشدید')}</h1><p>${t('De testversie gebruikt 44/50 als slaaggrens. Later kunnen we uitgebreide foutfeedback per thema toevoegen.','نسخه فعلی حد قبولی ۴۴/۵۰ دارد. بعداً می‌توانیم بازخورد کامل اشتباه‌ها را بر اساس موضوع اضافه کنیم.')}</p><button class="primary" onclick="closeExam()">${t('Terug naar examens','بازگشت به امتحان‌ها')}</button></div></div>`; const q=e.questions[e.index],ans=state.lang==='fa'?q.aFa:q.aNl; return `<div class="exam-wrap ${state.lang==='fa'?'rtl':''}"><div class="exam-top"><button class="ghost" onclick="closeExam()">✕</button><div class="qmini">${e.index+1}/50</div><div class="exam-progress progress"><i style="width:${((e.index+1)/50)*100}%"></i></div><div class="timer" id="timer">${String(Math.floor(e.remaining/60)).padStart(2,'0')}:${String(e.remaining%60).padStart(2,'0')}</div></div><div class="exam-main"><section class="question-card"><div class="question-art">${art(q.seed+e.num)}</div><h2>${t(q.qNl,q.qFa)}</h2><div class="answers">${ans.map((a,i)=>`<button class="answer ${e.answers[e.index]===i?'selected':''}" onclick="answerExam(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div class="exam-bottom"><button class="ghost" onclick="moveQ(-1)" ${e.index===0?'disabled':''}>← ${t('Vorige','قبلی')}</button>${e.index===49?`<button class="primary" onclick="finishExam()">${t('Inleveren','تحویل')}</button>`:`<button class="primary" onclick="moveQ(1)">${t('Volgende','بعدی')} →</button>`}</div></section><aside class="side-nav"><h3>${t('Vragen','سوال‌ها')}</h3><div class="qgrid">${Array.from({length:50},(_,i)=>`<button class="${i===e.index?'current':''} ${e.answers[i]!=null?'done':''}" onclick="gotoQ(${i})">${i+1}</button>`).join('')}</div><button class="primary" style="width:100%;margin-top:14px" onclick="finishExam()">${t('Examen inleveren','تحویل امتحان')}</button></aside></div></div>`}
function render(){document.documentElement.lang=state.lang==='fa'?'fa':'nl';document.documentElement.dir=state.lang==='fa'?'rtl':'ltr';document.getElementById('app').innerHTML=state.exam?examView():nav()+({home, dashboard, lessons:lessonsView, signs:signsView, words:wordsView, hazard:hazardView, exams:examsView}[state.view]());}
render();
</script></body></html>
