{let list=all().filter(l=>l.m===S.mod);return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><div><h1>${u('theory')}</h1><div class="mut">${u('modules')}</div></div></div><div class="chips">${MOD.map((m,i)=>`<button class="${S.mod===i+1?'on':''}" onclick="S.mod=${i+1};render()">${i+1}. ${S.lang==='fa'?FM[i]:m[0]}</button>`).join('')}</div><div class="grid" style="margin-top:10px">${list.map(l=>`<article class="card lesson"><div class="pic"><img loading="lazy" src="${img(l)}" onerror="this.src='/images/img01.png'"></div><h3>${S.lang==='fa'?faTitle(l):l.id+'. '+l.title}</h3><span class="pill">${isDone(l.id)?'✓ '+u('learned'):u('lesson')}</span><div class="row"><span class="mut" style="font-size:12px">${S.lang==='fa'?FM[l.m-1]:l.cat}</span><button class="mini" onclick="openLesson(${l.id})">${u('open')}</button></div></article>`).join('')}</div><div class="pager"><button class="ghost" onclick="setMod(S.mod-1)" ${S.mod===1?'disabled':''}>←</button><b>${S.mod}/15</b><button class="ghost" onclick="setMod(S.mod+1)" ${S.mod===15?'disabled':''}>→</button></div></main>`}function openLesson(id){S.lesson=L(id);S.la=null;render()}function lessonModal(){if(!S.lesson)return'';let l=S.lesson,d=detail(l);return`<div class="overlay" onclick="if(event.target===this){S.lesson=null;render()}"><section class="modal ${S.lang==='fa'?'rtl':''}"><div class="mhead"><button class="ghost" onclick="S.lesson=null;render()">✕</button><b>${S.lang==='fa'?faTitle(l):l.id+'. '+l.title}</b></div><div class="mbody"><div class="pic" style="height:270px"><img src="${img(l)}" onerror="this.src='/images/img01.png'"></div><div class="boxes"><div class="box"><h4>${u('rule')}</h4><p>${t(d.r,'اول تمام وضعیت ترافیک و قانون مربوط را بررسی کنید.')}</p></div><div class="box"><h4>${u('example')}</h4><p>${t(d.e,'در عمل اول نگاه کنید، سرعت را تنظیم کنید و سپس با ایمنی عمل کنید.')}</p></div><div class="box"><h4>${u('tip')}</h4><p>${t(d.t,'در امتحان اول علایم، خط‌کشی، حق تقدم و خطر را پیدا کنید.')}</p></div><div class="box"><h4>${u('mistake')}</h4><p>${t(d.m,'خیلی سریع تصمیم نگیرید و تمام وضعیت را ببینید.')}</p></div></div><div class="box" style="margin-top:9px"><h4>${u('question')}</h4><p>${t(d.q,'بهترین قدم اول چیست؟')}</p>${d.a.map((a,i)=>`<button class="ans ${S.la==null?'':i===d.c?'good':S.la===i?'bad':''}" onclick="S.la=${i};render()">${String.fromCharCode(65+i)}. ${S.lang==='fa'?['تمام وضعیت را بررسی کنید','فوراً عمل کنید','همیشه توقف کنید'][i]:a}</button>`).join('')}</div><button class="primary" style="margin-top:10px" onclick="toggle(${l.id})">${isDone(l.id)?'✓ '+u('learned'):u('mark')}</button></div></section></div>`}function words(){let sub=WORD.slice(S.wp*10,S.wp*10+10),max=2;return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h1>${u('trafficwords')}</h1></div><div class="words">${sub.map(w=>`<div class="word"><span>${w[0]}</span><b>${w[1]}</b></div>`).join('')}</div><div class="pager"><button class="ghost" onclick="S.wp=Math.max(0,S.wp-1);render()">←</button><b>${S.wp+1}/${max}</b><button class="ghost" onclick="S.wp=Math.min(${max-1},S.wp+1);render()">→</button></div></main>`}const H=[['Een kind staat vlak bij de rijbaan.','یک کودک نزدیک جاده ایستاده است.','rem'],['Je ziet ver vooruit een rood verkeerslicht.','از دور چراغ سرخ را می‌بینید.','gas'],['De weg is vrij en er is geen direct gevaar.','جاده آزاد است و خطر فوری وجود ندارد.','nothing'],['Een auto remt plots voor je.','موتر جلوی شما ناگهان ترمز می‌کند.','rem']];function hazard(){let i=+(localStorage.getItem('hi')||0)%H.length,h=H[i];return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h1>${u('situation')}</h1></div><section class="card pad"><div class="pic" style="height:300px"><img src="${IMG[i%IMG.length]}" onerror="this.src='/images/img01.png'"></div><h2>${S.lang==='fa'?h[1]:h[0]}</h2><p class="mut">${u('chooseaction')}</p><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="primary" onclick="haz('rem','${h[2]}')">${u('brake')}</button><button class="primary" onclick="haz('gas','${h[2]}')">${u('gas')}</button><button class="primary" onclick="haz('nothing','${h[2]}')">${u('nothing')}</button></div><div id="hm"></div></section></main>`}function haz(a,c){let m=document.getElementById('hm');if(m)m.innerHTML=`<div class="box" style="margin-top:10px">${a===c?t('✓ Goed','✓ درست'):t('Niet juist — probeer opnieuw','درست نیست — دوباره کوشش کنید')}</div>`;if(a===c){localStorage.setItem('hi',(+(localStorage.getItem('hi')||0)+1)%H.length);setTimeout(render,650)}}const Q=[['Je nadert haaientanden. Wat doe je?','به خطوط مثلثی نزدیک می‌شوید. چه می‌کنید؟',['Voorrang verlenen','Doorrijden','Claxonneren'],['حق تقدم بدهید','عبور کنید','بوق بزنید'],0],['Wat doe je vóór een rijstrookwissel?','پیش از تغییر خط چه می‌کنید؟',['Spiegels en dode hoek controleren','Alleen richting aangeven','Harder rijden'],['آینه‌ها و نقطه کور را بررسی کنید','فقط راهنما بزنید','سرعت را زیاد کنید'],0],['Wat gebeurt met de remweg bij hogere snelheid?','با سرعت بیشتر فاصله ترمز چه می‌شود؟',['Wordt langer','Wordt korter','Blijft gelijk'],['بیشتر می‌شود','کمتر می‌شود','یکسان می‌ماند'],0]];function exams(){let st=S.ep*6;return`<main class="wrap ${S.lang==='fa'?'rtl':''}"><div class="head"><h1>${u('practiceexams')}</h1></div><div class="grid">${Array.from({length:6},(_,j)=>`<div class="card pad"><span class="pill">${u('exam')} ${st+j+1}</span><h2>50 ${u('questions')}</h2><p class="mut">30 ${u('minutes')}</p><button class="primary" onclick="startExam(${st+j+1})">${u('startexam')}</button></div>`).join('')}</div><div class="pager"><button class="ghost" onclick="S.ep=Math.max(0,S.ep-1);render()">←</button><b>${S.ep+1}/5</b><button class="ghost" onclick="S.ep=Math.min(4,S.ep+1);render()">→</button></div></main>`}function startExam(n){S.exam={n,i:0,a:Array(50).fill(null),r:1800};render();S.exam.timer=setInterval(()=>{if(!S.exam)return;S.exam.r--;let e=document.getElementById('timer');if(e)e.textContent=time(S.exam.r);if(S.exam.r<=0)finish()},1000)}function time(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function qAt(i,n){let q=Q[(i+n)%Q.length];return{q:S.lang==='fa'?q[1]:q[0],a:S.lang==='fa'?q[3]:q[2],c:q[4],im:IMG[(i+n)%IMG.length]}}function examView(){let e=S.exam,q=qAt(e.i,e.n);return`<div class="exam ${S.lang==='fa'?'rtl':''}"><div class="examtop"><button class="ghost" onclick="closeExam()">✕</button><b>${e.i+1}/50</b><div class="bar"><i style="width:${(e.i+1)*2}%"></i></div><b id="timer">${time(e.r)}</b></div><main class="examc"><section class="card pad"><div class="pic" style="height:min(34vh,260px)"><img src="${q.im}" onerror="this.src='/images/img01.png'"></div><h2>${q.q}</h2>${q.a.map((a,i)=>`<button class="ans ${e.a[e.i]===i?'good':''}" onclick="S.exam.a[S.exam.i]=${i};render()">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div class="pager"><button class="ghost" onclick="S.exam.i=Math.max(0,S.exam.i-1);render()">←</button>${e.i===49?`<button class="primary" onclick="finish()">${u('submit')}</button>`:`<button class="primary" onclick="S.exam.i++;render()">${u('next')} →</button>`}</div></section></main></div>`}function finish(){clearInterval(S.exam.timer);let sc=0;for(let i=0;i<50;i++)if(S.exam.a[i]===qAt(i,S.exam.n).c)sc++;alert(t('Score: ','امتیاز: ')+sc+'/50');S.exam=null;render()}function closeExam(){if(S.exam?.timer)clearInterval(S.exam.timer);S.exam=null;render()}function authView(){if(!S.auth)return'';let reg=S.mode==='register';return`<div class="auth"><section class="authbox ${S.lang==='fa'?'rtl':''}"><div class="logo"><i>M</i><span>Mursaltheorie</span></div><h2>${t('Welkom','خوش آمدید')}</h2><div class="tabs"><button class="${!reg?'on':''}" onclick="S.mode='login';render()">${u('login')}</button><button class="${reg?'on':''}" onclick="S.mode='register';render()">${t('Account maken','ساخت حساب')}</button></div>${reg?`<div class="field"><label>${t('Naam','نام')}</label><input id="name"></div>`:''}<div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>${t('Wachtwoord','رمز')}</label><input id="pass" type="password"></div><button class="primary" style="width:100%" onclick="submitAuth()">${reg?t('Account maken','ساخت حساب'):u('login')}</button><button class="ghost" style="width:100%;margin-top:8px" onclick="S.auth=false;render()">${t('Terug','بازگشت')}</button></section></div>`}function submitAuth(){let e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value,n=document.getElementById('name')?.value.trim()||e.split('@')[0];if(!e.includes('@')||p.length<4){alert(t('Controleer e-mail en wachtwoord','ایمیل و رمز را بررسی کنید'));return}S.user={email:e,name:n};localStorage.setItem('mt-user',JSON.stringify(S.user));S.auth=false;render()}function openAuth(m){S.mode=m;S.auth=true;render()}function setLang(l){S.lang=l;localStorage.setItem('mt-lang',l);render()}function setMod(m){if(m<1||m>15)return;S.mod=m;render();scrollTo(0,0)}function go(v){S.view=v;render();scrollTo(0,0)}function done(){return JSON.parse(localStorage.getItem('mt-done')||'[]').length}function isDone(id){return JSON.parse(localStorage.getItem('mt-done')||'[]').includes(id)}function toggle(id){let a=JSON.parse(localStorage.getItem('mt-done')||'[]');a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('mt-done',JSON.stringify(a));render()}function render(){document.documentElement.lang=S.lang==='fa'?'fa':'nl';document.documentElement.dir=S.lang==='fa'?'rtl':'ltr';root.innerHTML=S.exam?examView():nav()+({dashboard,lessons,words,hazard,exams}[S.view]||dashboard)()+mobile()+lessonModal()+authView()}render();</script></body></html>
